      - "GitHub-sourced archives go through the same extract_to_scratch/archive validation: a pipeline test feeds a GitHub-served zip with a '../escape' entry (or symlink escape) and gets the existing unsafe-path error with nothing written outside scratch; existing archive.rs tests sanitize_entry_path_rules and validate_tree_rejects_symlinks_escapes_and_hardlinks still pass."
