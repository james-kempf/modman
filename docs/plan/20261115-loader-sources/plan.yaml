    description: "Reuse rung: extend the app/loaders.rs pipeline, keeping PreviewRequest's shape. Install/upgrade/adopt with archive None for a loader that declares github: call T2 into the archive cache, then run the existing extract_to_scratch -> probe -> preview/run flow with the GitHub origin (any placeholder Local origin from the caller is ignored). mods/install.rs + app/install.rs: the InstallerRedirect outcome (narrowed scope from T1) never stages, deploys or runs the archive; it returns a LoaderArchive-style error/result naming the loader with a redirect flag so callers start the GitHub preview. find_loader_junk: also flag mod rows whose nexus_mod_id equals a loader's nexus_mod_id for the same game."
    wave: 2
