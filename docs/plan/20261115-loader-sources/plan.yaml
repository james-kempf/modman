      - "A non-installer optional archive from the same Nexus mod id (no top-level exe/msi, no layout) installs as a regular mod, unchanged."
      - "find_loader_junk reports a mod row with nexus_mod_id == loader nexus_mod_id (fixture mirroring the user's mod 219); removal deletes only reported rows."
