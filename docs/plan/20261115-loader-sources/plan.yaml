    acceptance_criteria:
      - "pipeline_tests (wiremock): install preview with loader_key and archive None for a loader with github fetches, caches, reports provenance Verified, and run installs; upgrade and adopt take the same path."
      - "Archive None for a loader without github keeps today's error."
