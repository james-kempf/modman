tasks:
  - id: T1
    title: LoaderDef GitHub source + aliases schema, provenance, narrowed id-only claim
    description: "Reuse rung: extend existing LoaderDef/Glob/provenance. Add optional `github: Option<GithubSource{repo, asset: Glob}>` and `aliases: Aliases{urls, names}` (deny_unknown_fields). Validate repo as exactly owner/repo ([A-Za-z0-9._-]+/[A-Za-z0-9._-]+, no '..'). Normalize alias URLs with requirements::norm_url; names must be non-empty. provenance(): a GitHub origin is Verified iff its repo equals the declared repo (case-insensitive) and the asset name matches the declared glob. Id-only claim (narrowed, see decisions): returns a distinct InstallerRedirect outcome only when all hold: probe nexus_mod_id == def.nexus_mod_id on the same domain, a top-level *.exe or *.msi entry exists, required_paths do not match, and def.github is set. Otherwise behavior is unchanged."
    wave: 1
    depends_on: []
    agent: gem-implementer
    status: completed
    retries_used: 0
    context_cluster: loader_sources
    acceptance_criteria:
      - "TOML with [loaders.github] repo+asset and [loaders.aliases] parses; unknown keys under loaders, loaders.github and loaders.aliases are rejected (unit tests)."
      - "Invalid repo (no slash, extra segments, URL form, '..', empty) and an empty asset glob fail validation with clear messages."
      - "provenance(): GitHub{repo match, asset glob match} -> Verified; repo mismatch, asset mismatch, or no github declared -> Unverified (one test each)."
      - "Id-only claim tests: (a) matching id + top-level MelonLoader.Installer.exe + no layout + github -> InstallerRedirect; (b) same without github -> None; (c) matching id, no exe/msi, no layout -> None (installs normally); (d) exe only in a subfolder -> None; (e) layout-matching archive -> normal LoaderMatch; (f) different mod id with exe -> None."
      - "Validation: `cargo test -p vessel-core --lib loaders::declarative::` and `cargo test -p vessel-core --lib games::definitions::` pass; `cargo test --workspace` passes; `cargo clippy -p vessel-core --all-targets -- -D warnings` clean."
    handoff:
      constraints:
        - "Do not change DownloadOrigin serialization or loader_installs.origin values."
        - "Do not touch smapi.rs behavior."
      high_risk_signals: [schema_change, contract_change]

  - id: T2
    title: Hardened GitHub release-asset fetcher into archive cache
    description: "Reuse rung: built on download::fetch::Fetcher. New module crates/vessel-core/src/loaders/github.rs exposing production `fetch_latest_asset(repo, asset_glob, dest_dir) -> Result<{path, origin: DownloadOrigin::GitHub{repo,tag,asset}, version}, GithubError>`. Base URL is the constant https://api.github.com. Steps: (1) GET releases/latest with a 1 MiB body cap; on 403 with x-ratelimit-remaining 0, or 429, return RateLimited (message names the GitHub API rate limit and the reset time when known); (2) reject draft/prerelease; (3) exactly one asset name matches the glob, and the name has no path separators or '..'; (4) reject asset.size > 200 MiB; (5) pin browser_download_url: https, host == github.com, path prefix /{repo}/releases/download/{tag}/, last segment == asset.name; (6) download with max_bytes 200 MiB and a redirect check limited to https on github.com / objects.githubusercontent.com / release-assets.githubusercontent.com; (7) require byte length == asset.size; (8) verify sha256 when digest is present; (9) on any failure remove the partial file. Never executes anything. Test-only constructor (#[cfg(test)]) injects the wiremock base URL and relaxes scheme/host."
    wave: 1
    depends_on: []
    agent: gem-implementer
    status: completed
    retries_used: 0
    context_cluster: loader_sources
    acceptance_criteria:
      - "wiremock happy path: asset written under dest_dir; returns GitHub origin with tag and asset name; version == tag."
      - "Rejection tests, one each: zero matching assets; multiple matching assets; asset name containing '/' or '..'; prerelease/draft payload; repo argument not owner/repo; download URL http://; download URL host not github.com; download URL path not under /{repo}/releases/download/{tag}/; redirect to a non-allowlisted host; redirect to http; API body > 1 MiB; asset.size > 200 MiB; streamed body > cap; length != asset.size; sha256 digest mismatch; and the partial file is absent after each failure."
      - "Rate limit: 403 with x-ratelimit-remaining: 0, and 429, each return RateLimited, and the Display text contains 'rate limit'."
      - "Test override unreachable from production: the base-URL/relaxed constructor is #[cfg(test)] (or pub(crate) and referenced only from #[cfg(test)] code). Verified by `cargo build -p vessel-core --release` plus a grep in the review showing no non-test caller; no definition or IPC field can set the base URL."
      - "Generic User-Agent; no user-identifying headers."
      - "Validation: `cargo test -p vessel-core --lib loaders::github::` passes; `cargo test --workspace` passes; `cargo clippy -p vessel-core --all-targets -- -D warnings` clean."
    handoff:
      constraints:
        - "No new HTTP crate; reuse Fetcher and the existing reqwest/wiremock deps."
      high_risk_signals: [security_sensitive, data_flow_change]

  - id: T3
