plan_id: 20261115-loader-sources
status: pending
tldr: |
  Add an optional GitHub release source and url/name aliases to declarative LoaderDef,
  a hardened GitHub release-asset fetcher into the loader archive cache (DownloadOrigin::GitHub),
  app wiring so install/upgrade/adopt fall back to GitHub, an id-only claim that redirects
  installer-only Nexus archives (top-level .exe/.msi) to the GitHub source, a structured
  InstallLoader requirements action, junk detection for mod rows carrying a loader's Nexus id,
  a Requirements "Install" button, then game-support docs/checker and finally schedule1.toml.
created_at: "2026-11-15"
created_by: gem-planner
revision: 2
replan_count: 0
planner_revision_used: true

decisions:
  - "Schema: [loaders.github] { repo = 'owner/repo', asset = <Glob> } plus [loaders.aliases] { urls = [..], names = [..] } on LoaderDef; deny_unknown_fields kept on every new table. Reason: smallest additive shape; reuses loaders::glob::Glob (reuse rung)."
  - "Fetcher reuses download::fetch::Fetcher (with_max_bytes, with_redirect_check, with_retry). Only new code: GitHub releases API call, asset selection, URL pinning, digest/size checks."
  - "Release selection (accepted): GET {api}/repos/{repo}/releases/latest; exactly one asset must match the glob, else error. Tag becomes version and DownloadOrigin::GitHub.tag."
  - "Integrity (accepted): verify sha256 when the API asset carries 'digest'; reject mismatch. Always enforce downloaded length == asset.size."
  - "Pre-fetch URL pin: browser_download_url must be https, host exactly github.com, path prefix /{repo}/releases/download/{tag}/ (repo compared case-insensitively, tag percent-decoded) with the final segment equal to asset.name. Redirects restricted to github.com, objects.githubusercontent.com, release-assets.githubusercontent.com, https only."
  - "Limits: API JSON body cap 1 MiB; asset cap 200 MiB (also reject asset.size > cap before download). GitHub 403 with x-ratelimit-remaining: 0, or 429, maps to a distinct RateLimited error whose message says the GitHub API rate limit was hit and when it resets (from x-ratelimit-reset when present)."
  - "Test override: the API base URL and scheme/host relaxation for wiremock live behind a #[cfg(test)]-only constructor (or pub(crate) constructor used only from #[cfg(test)] code in vessel-core). Production entry point has no parameter for base URL, scheme, or host."
  - "Id-only claim scope (narrowed): applies only when the archive's Nexus mod id equals the loader's nexus_mod_id (same game domain), the archive has a top-level *.exe or *.msi entry (case-insensitive), the archive does NOT match required_paths, and the loader declares github. Any other file from that Nexus page (e.g. optional docs/configs without a top-level exe/msi) follows the normal path: loader match if layout matches, else regular mod install."
  - "T3/T5 compile boundary: T3 keeps PreviewRequest's shape unchanged. Install/upgrade/adopt with archive = None and a loader that declares github fetches from GitHub; the Local placeholder origin the Tauri command builds today is ignored in that case. So src-tauri needs no edits until T5, and `cargo test --workspace` passes at the end of every wave."
  - "Requirements contract: ReqRow keeps `hint: String` (CLI fix text) and gains `action: Option<ReqAction>`, where ReqAction is a serde-tagged enum (kind = 'install_loader', loader_key). For loader rows, hint is empty: there is no CLI loader command, and Requirements.tsx must not print a fake 'fix: vessel ...'. T4 owns the Rust side, including the CLI's hand-written deps --json serializer, so the workspace compiles. T5 owns the TS side."
  - "InstallLoader consumers (complete list, from grep): Rust requirements.rs (construction, tests), crates/vessel-cli/src/commands/mods.rs:510 hand-written JSON; TS apps/desktop/src/ipc/types.ts:503 ReqRow, apps/desktop/src/views/Requirements.tsx (installTarget:58, row render :188/:216), apps/desktop/src/mock/demo.ts:122-123 fixtures; Tauri passes ReqRow through serde (no match). No other views or CLI paths read hint."
  - "Ordering: T7 (prompt/checker) runs before T6 (schedule1.toml), so the checker that decides support already knows the new fields. T6 sets support only to the value the checker accepts."
  - "Single reviewer task in final wave; the fetcher is the only security-sensitive surface and is isolated in T2."

assumptions:
  - "No GitHub auth token: unauthenticated API (60 req/h) is acceptable for user-initiated loader installs."
  - "wiremock (already a vessel-core dev-dependency) is used for mocked HTTP."
  - "Built-in SMAPI plugin (loaders/smapi.rs) is unchanged; the GitHub source is declarative-only."
  - "MelonLoader.x64.zip root contains version.dll + MelonLoader/ and so satisfies the existing required_paths."
  - "Support::Tested still exists: verified at planning time in games/definitions.rs:15-26 (enum Tested|Experimental, as_str 'tested', test at :376). Commit 26ed9bf touched only apps/desktop/src/views/Games.tsx and Games.test.tsx (UI badge). T6 re-verifies."
  - "Existing archive extraction guards cover GitHub archives unchanged: archive.rs tests sanitize_entry_path_rules and validate_tree_rejects_symlinks_escapes_and_hardlinks:1258, and app/loaders.rs place_file/fix_mode use deploy::confine."
  - "The parallel scripts task (plan 20261115-vessel-game-support-workflow) has not landed as of planning (no matching commit on develop)."

