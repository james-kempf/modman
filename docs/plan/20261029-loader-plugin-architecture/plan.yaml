    description: "Changes existing code, reusing the existing paths. mods/install.rs install_archive: after extract and before find_fomod/normalize_layout, registry.match_archive yields InstallOutcome::Loader{loader_key, preview_id} via T4b preview (op=Install, or Adopt when a manual install is detected), with no mods/mod_files rows. Update every R1 call site: app/install.rs, app/nxm.rs (emit loader_pending, never run), and collections (a Loader outcome is pending, not failed). deploy/plan.rs: exclude active loader-owned paths from placement and from replaced-file backup/restore, and purge leaves them alone. requirements.rs: tool:smapi status, version and drift come from loader_installs, falling back to the file scan; the install hint routes to the loader flow. Junk cleanup: detect existing mod rows whose files match the 'SMAPI * installer/' signature and offer removal through the existing mod-remove path (purge + delete). Add a minimal src-tauri passthrough so the Loader outcome serializes."
