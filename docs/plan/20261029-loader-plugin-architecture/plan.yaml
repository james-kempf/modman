  - id: T2
    title: Runtime detection, Proton preflight, hardened runner, lstat snapshot
    description: "Extend games/steam.rs; add loaders/{runtime,runner,snapshot}.rs. (a) steam.rs: CompatToolMapping, config_info, the proton binary resolved from the mapped tool only, proton path location and ownership validation, appmanifest StateFlags, loginusers.vdf MostRecent, Flatpak Steam roots. (b) runtime.rs: detect, in order: override -> mapping -> ELF/.exe sniff -> Unknown. Preflight for Proton: game not running (/proc exe/cwd scan under the game dir), StateFlags fully installed, pfx exists, mapped tool; warn if config_info differs. (c) runner.rs: `trait ProcessRunner`. RealRunner builds argv from host+target (bash, or proton run cmd.exe /c with metacharacter rejection and quoting; flatpak-spawn --host prefix if R1 requires it), canonicalizes the target inside the scratch dir with no symlink components, uses the minimal env per decision, process_group(0), PDEATHSIG via pre_exec, stdin null, captured logs, and on timeout kills the pgid and runs wineserver -k for Proton. It returns pid, pgid and proc_start through a callback before waiting, so the caller can persist them. FakeRunner applies scripted mutations and counts calls. (d) snapshot.rs: an lstat no-follow manifest (scoped sha256, whole-dir stat), a deploy-manifest conflict check for in-scope paths, a copy/reflink backup into deploy/backup.rs (never hardlink), a diff that covers links, rollback, and registration of backup_ref as GC roots in the backup store's GC."
    wave: 2
    depends_on: [R1, T1]
    agent: gem-implementer
    status: completed
    retries_used: 0
    context_cluster: loader_core
    acceptance_criteria:
      - "Runtime and preflight tests (fixture Steam trees) cover: mapping -> Proton with the resolved path; ELF and no mapping -> Native; .exe only -> Proton; override wins; ambiguous -> Unknown; a world-writable or out-of-library proton is rejected; StateFlags not fully installed is blocked; a missing pfx is blocked; a config_info mismatch warns; a Flatpak root is flagged unsupported for Proton."
      - "Injection tests: a game path containing spaces, $(), ;, backticks and quotes is passed as one argv element to a test helper on the bash host. For BatScript, any arg containing & | < > ^ % ! \" ( ) or a newline is rejected with UnsafeForCmd before spawn, and the generated cmd line for a safe path is exactly as expected."
      - "Runner tests: a target outside the scratch dir, or with a symlinked path component, is rejected; the timeout kills the whole pgid (a grandchild helper is gone); a child sees no env vars beyond the allowlist, including a planted NEXUS_API_KEY; logs capture stdout and stderr; pid, pgid and proc_start reach the callback before exit."
      - "Snapshot tests: symlinks are recorded as links and never followed; a backup is never a hardlink (inode differs); an in-scope Vessel-deployed file or link yields a conflict; create, modify and delete are classified and rolled back; out-of-scope changes are flagged unrecoverable; a backup GC run keeps blobs referenced by loader_files."
      - "No `sh -c`/`bash -c` or joined-string shell invocation in loaders/. cargo test and clippy -D warnings pass."
    handoff:
