plan_id: 20261029-loader-plugin-architecture
status: completed
tldr: |
  New vessel-core loaders module. One LoaderPlugin trait serves Rust plugins (vendor installers) and
  declarative [[loaders]] TOML (game-root deploy plus launch changes), so later loaders need no core changes.
  SMAPI is the first plugin and runs the vendor scripts by default:
    native: /bin/bash "install on Linux.sh" via argv;
    Proton: "install on Windows.bat" via core-built `<proton> run cmd.exe /c`, with strict
    cmd-metacharacter rejection.
  Every spawning op (install, upgrade, repair, uninstall, adopt) goes through these steps:
    provenance (Nexus API 2400 or Pathoschild GitHub, downloaded by Vessel only)
    -> preview in a 0700 read-only scratch dir
    -> plan_hash over archive/target/install.dat/scratch-manifest/unverified_ack
    -> core-enforced consent token
    -> preflight (Proton: game not running, fully installed, pfx exists, mapped tool)
    -> phase-tracked run: backing_up -> spawned -> diffing -> done, with pid/pgid stored,
       PDEATHSIG, timeout kill plus wineserver -k
    -> lstat diff into loader_files, with backups kept as GC roots.
  Steam-update vanilla classification runs before repair, upgrade and uninstall. Launch option: copy plus
  ack by default; an explicit Apply writes localconfig.vdf for the MostRecent account.
  Runs with user permissions (no sandbox in v1), and the UI and docs say so plainly. Seven waves.
created_at: "2026-10-29"
created_by: gem-planner
revision: 2
replan_count: 1
planner_revision_used: true

baseline:
  objective: 'Design and plan a plugin architecture in the Vessel mod manager (Rust workspace /home/jkempf/Repositories/modman, crates/vessel-*, Tauri desktop apps/desktop) that can install installer/loader-style mods (archive installers, game-root drop-in loaders, loaders needing launch/exe changes). First concrete plugin: Stardew Valley SMAPI, which must run the bundled vendor installer: "install on Linux.sh" for the native Linux game, and "install on Windows.bat" for the Proton version.'
  acceptance_criteria:
    - 'A plugin abstraction (trait and/or declarative definition) that per game/loader can: detect a loader archive at install time (instead of deploying it into Mods/), choose an install strategy (run vendor installer | declarative file deploy to game root | launch-option/DLL-override changes), detect installed state and version, uninstall/repair, and report status to the Requirements view.'
    - 'SMAPI plugin: detects the SMAPI archive; determines native vs Proton for the game; native runs the Linux installer non-interactively (--install --no-prompt --game-path <dir>, or the equivalent via its internal installer) with captured output; Proton runs install on Windows.bat (or the SMAPI.Installer.exe it invokes) inside the game''s Proton/Wine prefix with the right Proton binary and env, then surfaces or applies the needed Steam launch option ("<game>\StardewModdingAPI.exe" %command%). Supports uninstall (--uninstall) and upgrade.'
    - 'Integrates with the existing pipeline: crates/vessel-core/src/mods/install.rs install_archive (L133), staging.rs marker_layout/ModRoot{Deploy,Game}, deploy/plan.rs root=game, backup/journal, requirements.rs TOOLS (smapi detection), the Requirements.tsx Install button, games/steam.rs Proton prefix discovery, app/games.rs launch, app/shortcut.rs Steam config handling.'
    - 'Safety for running downloaded scripts: verify archive provenance (Nexus mod id 2400 / expected file layout, optional hash), show the user what will run and require explicit consent, scoped working dir, timeout, captured logs, snapshot or manifest of game-dir changes before/after so Vessel can report and roll back, no shell interpolation of paths.'
    - 'Tracks resulting files for status and uninstall even though a vendor installer made the changes (pre/post diff of the game dir).'
    - 'Extensible: the same architecture can later express BepInEx, script extenders (SKSE/F4SE), REFramework, RED4ext/CET, ENB/ReShade, MelonLoader via declarative definitions or additional plugins, without core changes.'
    - 'Tests: unit tests with fixture archives (no real vendor binaries), fake runner for installer execution, native/Proton selection tests; cargo test, clippy, and desktop vitest/tsc pass.'
  captured_at: "2026-10-29"

replan:
  reason: "The critic review returned 'revise': blocking security and recovery gaps (findings 1-22), plus orchestrator decisions that restore requirement fidelity (vendor scripts are the default)."
  changed_tasks: [R1, T1, T2, T3, T5, T6, V1]
  added_tasks: [S1, T4a, T4b, T7, T8, D1]
  removed_tasks: [T4]
  revised_tasks: [R1, T1, T2, T3, T5, T6, V1]
  invalidated_tasks: []
  invalidated_assumptions:
    - "rev1: 'Exec SMAPI.Installer directly, scripts only if R1 allows' -> the scripts are now the default. If a script cannot run non-interactively, that is needs_input to the user, never a silent switch."
    - "rev1: 'Provenance from download meta or a GitHub asset name pattern' -> only downloads Vessel itself made from the Nexus API (mod 2400) or the Pathoschild GitHub release API count as verified."
    - "rev1: 'Single InstallerSpec.program' -> split into target and host. Core builds the Proton wrapping."
    - "rev1: 'Status row running + recovery marks interrupted' -> phase-tracked loader_runs with stored pid/pgid and a persisted pre-manifest."
    - "rev1: 'DISPLAY/WAYLAND in allowlist' -> minimal env; display vars only if R1 proves they are needed."
    - "rev1: 'T5 depends only on T1' -> T5 depends on T4b's preview API (finding 7)."
  preserved_acceptance_criteria: ["All 7 baseline acceptance criteria unchanged"]
  new_risks:
    - "cmd.exe parses the .bat command line itself, so argv quoting alone does not prevent injection. Mitigation: reject metacharacters and test for injection."
    - "Recovery could kill a reused pgid. Mitigation: store the process start time and verify it before killing."
    - "The installer has side effects outside the game dir (~/.smapi) that cannot be rolled back. They are recorded and disclosed."
  progress_signal: "No tasks executed yet. Revision before build."

decisions:
  - "Requirement fidelity: SMAPI runs the vendor scripts by default. Native: program=/bin/bash, argv=[<abs script>, --install|--uninstall, --no-prompt, --game-path, <dir>] (no -c). Proton: program=<validated proton>, argv=[run, cmd.exe, /c, <bat win path>, args...]. The orchestrator recorded the tradeoff: R1 had recommended declarative deploy, and the user's choice wins. Isolation is consent plus env, cwd and timeout limits plus rollback, with no sandbox; the UI and docs state 'runs with your user permissions'."
  - "Trait: `trait LoaderPlugin { key(); matches(&GameCtx,&ArchiveProbe)->Option<LoaderMatch>; provenance(&LoaderMatch,&DownloadOrigin)->Provenance; plan(op: Install|Upgrade|Repair|Uninstall|Adopt, &GameCtx, &Runtime, extracted: Option<&Path>)->Result<LoaderPlan>; detect(&GameCtx,&Store)->LoaderStatus }`. `LoaderPlan { steps: Vec<Step>, touch_scope: Vec<Glob>, external_side_effects: Vec<String>, expected_version }`. `enum Step { RunInstaller(InstallerSpec), DeployFiles(PayloadRecipe{select(nested), root=game, map, exclude, mode per file}), Launch(LaunchChange{exe|env|dll_overrides|steam_launch_option}) }`. extracted=None is allowed for uninstall and detect."
  - "InstallerSpec = { target: Target{rel_path, kind: BashScript|BatScript|Exe} /*canonicalized inside the scratch dir, no symlink components*/, args: Vec<Arg{Lit|GamePath|GamePathWin}>, host: Native | Proton{proton, compat_data, client_root, app_id} }. Only core turns host+target into argv. The proton path must be under a known Steam library steamapps/common/* or compatibilitytools.d/*, owned by the user or root, and not group- or world-writable. For BatScript, every arg is checked against the cmd metacharacters [&|<>^%!\"()\\r\\n] and rejected with UnsafeForCmd; allowed args are double-quoted."
  - "plan_hash = sha256(serialized plan + archive_sha256 + target sha256 + install.dat sha256 + scratch manifest hash + unverified_ack + op + game_id). The scratch dir is 0700 under <data>/loaders/scratch/<preview_id> and is made read-only after preview. The manifest is re-verified immediately before spawn. If R1 shows the installer writes into its own dir, it runs from a per-run copy verified against the manifest. Previews expire after 10 min."
  - "Every spawning op (install, upgrade, repair, uninstall, adopt) requires a preview_id plus a matching plan_hash. Repair re-verifies the cached archive's sha256 against loader_installs.archive_sha256. NXM, collections and auto-deploy only create pending previews."
  - "Provenance: verified only when Vessel itself downloaded the archive, either through the Nexus API (domain stardewvalley, mod 2400, file id recorded) or from a Pathoschild/SMAPI GitHub release asset through the API. The layout check is always enforced: a mismatch is a hard reject. Any other source is unverified and allowed only with unverified_ack=true inside the hashed plan, which core checks."
  - "Env (native): env_clear plus PATH, HOME, LANG, SMAPI_NO_TERMINAL=true, SMAPI_USE_CURRENT_SHELL=true. TERM, DISPLAY or WAYLAND_DISPLAY are added only if R1 proves they are needed. Proton adds STEAM_COMPAT_DATA_PATH, STEAM_COMPAT_CLIENT_INSTALL_PATH and, per R1, SteamAppId/SteamGameId. The Nexus API key and any Vessel secret are never in the env; a test asserts this."
  - "Process control: process_group(0), PR_SET_PDEATHSIG(SIGKILL) via pre_exec, stdin null, captured stdout/stderr, timeout (default 300s) -> kill pgid. On Proton timeout or interrupt: `<proton dir>/files/bin/wineserver -k` with WINEPREFIX=<compat_data>/pfx. The pid, pgid and process start time are stored, and recovery kills the stored pgid only when the start time still matches."
  - "Recovery: loader_runs.phase is backing_up, then spawned, then diffing, then done. The pre-manifest is persisted before spawn. On startup: phase=backing_up -> discard the run and refuse rollback (the backup is incomplete; the game is untouched). spawned -> kill the pgid if it is live, then offer rollback. diffing -> finish the diff, then offer rollback. done -> no action."
  - "Snapshot: lstat, never follow symlinks; symlinks are recorded as links. Backups are copies or reflinks, never hardlinks. Before backup, the in-scope paths are checked against the deploy manifest: a Vessel-deployed file or link in scope is a preflight conflict and the op is blocked. loader_files.backup_ref entries are GC roots of the backup store."
  - "SMAPI touch_scope: StardewValley, StardewValley-original, StardewModdingAPI*, smapi-internal/** (config.user.json preserved and tracked), steam_appid.txt, *.deps.json, Mods/ConsoleCommands/**, Mods/SaveBackup/**, Mods/.cache/**, Mods/ErrorHandler/**, Mods/TrainerMod/**, plus the obsolete DLL list from R1. external_side_effects: ~/.smapi (moved or created), recorded as unrecoverable."
  - "Vanilla classification before repair, upgrade and uninstall: hash the current StardewValley. If it equals the loader post hash, SMAPI is intact. If it equals the vanilla backup hash, the game reverted to the same vanilla. Any third hash means a Steam update: refresh the vanilla backup, and the StardewValley-original handling, from the new file. The pre-first-install vanilla is otherwise never replaced by SMAPI content."
  - "Manual SMAPI already installed (StardewModdingAPI.dll or StardewValley-original present, no loader_installs row): a normal install is blocked with ManualInstallDetected. 'Adopt' runs a consented op: vendor --uninstall, then verify StardewValley is an ELF and not a script, then a managed install. If verification fails, it is blocked with a 'verify game files in Steam' hint."
  - "Launch options: copy plus ack by default. Apply is explicit, targets the MostRecent account in loginusers.vdf, and shows a picker when there are several accounts. It refuses while Steam is running and re-checks steam_running() right before the atomic rename. It backs up the file, round-trips VDF escaping, and matches the apps key case-insensitively."
  - "Schema, migration 0007_loaders.sql: loader_installs(id PK, game_id NULL REFERENCES games ON DELETE SET NULL, game_dir TEXT, loader_key, version, runtime, strategy, status, nexus_mod_id, nexus_file_id, origin, archive_sha256, archive_path /*copy under <data>/loaders/archives/<sha>*/, vanilla_sha256, game_build, installed_at, updated_at), plus a partial UNIQUE index on (game_id, loader_key) WHERE status IN ('installed','running','interrupted'). loader_files(install_id, path, change, kind file|link, pre_sha256, post_sha256, backup_ref, out_of_scope, PRIMARY KEY(install_id, path)). loader_runs(id, install_id, op, consent_hash, phase, pid, pgid, proc_start, pre_manifest_path, started_at, ended_at, exit_code, timed_out, log_path). games gains runtime_override TEXT, launch_options_desired TEXT, launch_options_acked TEXT, launch_options_applied TEXT. The mods table is unchanged. Rollback data survives game removal."
  - "Wave order: T5 depends on T4b's preview API (finding 7). S1 reviews runner.rs and snapshot.rs after W2 and before the orchestrator builds on them. V1 stays as the final review."
  - "Coalescing: the opt-in manual smoke-test runbook is merged into D1 (same agent, same docs dir), and D1 inherits its criteria. The user runs it; no agent executes real SMAPI. The typed error-to-UX mapping (T7) is its own task, kept on core error codes plus a new TS module so it can run in parallel with T5 and T8."
  - "Scope cuts: no shipped BepInEx or SKSE definitions; fixtures prove extensibility end to end. No bubblewrap. Proton under Flatpak Steam is detected and reported unsupported in v1. Collection-to-loader mapping is limited to a pending preview."

assumptions:
  - "USER DECISION (2026-10-29): option A, fully automatic. SMAPI runs internal/linux/SMAPI.Installer (native) or internal/windows/SMAPI.Installer.exe (Proton) directly with --install|--uninstall --no-prompt --game-path. This supersedes the orchestrator's scripts-default decision, because R1 showed neither script forwards args (both BLOCKERs)."
  - "Orchestrator decision: the vendor scripts are the default (Linux.sh via /bin/bash argv with SMAPI_NO_TERMINAL/SMAPI_USE_CURRENT_SHELL; Windows.bat via core-owned Proton wrapping with metacharacter rejection). If R1 finds a script cannot run non-interactively and safely, the orchestrator raises needs_input to the user. Implementers must not switch to SMAPI.Installer on their own."
  - "Orchestrator decision: no sandbox in v1 is accepted. The consent dialog and docs state 'runs with your user permissions' and list the out-of-game side effects (~/.smapi) as unrecoverable."
  - "Orchestrator decision: launch options are copy plus ack by default. localconfig.vdf is written only on explicit Apply, for the loginusers.vdf MostRecent account, with a picker if there are several."
  - "Orchestrator decision: unverified archives are allowed only with a core-enforced unverified_ack inside the hashed plan."
  - "`<proton> run` works outside the Steam client with the STEAM_COMPAT_* env set. R1 confirms the pressure-vessel/SLR requirements. If Vessel ships as a Flatpak (R1 item), the runner prefixes `flatpak-spawn --host` as argv inside core."
  - "The working tree may have concurrent uncommitted user edits. Each task re-reads its target files right before editing and touches only the files listed for it."
  - "No real vendor binaries in automated tests. FakeRunner applies scripted fs mutations, and real-process runner tests use tiny test helper binaries or scripts written by the tests."

