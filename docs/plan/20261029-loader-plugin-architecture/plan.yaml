    description: "New code; nothing existing to reuse. Create crates/vessel-core/src/loaders.rs and loaders/{types,registry,declarative}.rs with the trait and types from the decisions (InstallerSpec target/host split, Arg, Step, PayloadRecipe with per-file mode, LaunchChange, Runtime, Provenance/DownloadOrigin, LoaderStatus, LoaderError). Add `#[serde(default)] loaders: Vec<LoaderDef>` to GameDefinition, keeping deny_unknown_fields. LoaderDef has match fields (nexus_mod_id, required_paths globs, forbidden_paths), payload, launch, couples_to. DeclarativeLoader implements plan() for DeployFiles and Launch, including conflict detection: payload paths that collide with another active loader or with Vessel-deployed files produce LoaderError::Conflict. Write migration 0007_loaders.sql exactly per the schema decision, register it in store.rs, and add store accessors. Wire lib.rs."
    wave: 1
    depends_on: []
    agent: gem-implementer
    status: completed
    retries_used: 0
    context_cluster: loader_core
    acceptance_criteria:
      - "BepInEx-shaped fixture (winhttp.dll + BepInEx/ to the game root, dll_overrides=[winhttp]) and SKSE-shaped fixture (game-root exe/dll + Data/Scripts, launch exe) parse, match their fixture archives, and plan Step::DeployFiles + Step::Launch. An unknown field is rejected. Per-file mode is honored in the plan. A payload collision yields Conflict."
