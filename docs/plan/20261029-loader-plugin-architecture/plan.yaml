tasks:
  - id: R1
    title: Verify SMAPI script, Proton and packaging facts (read-only)
    description: "Research from upstream source and docs only; nothing is executed. (1) SMAPI 4.x layout (internal/linux vs internal/unix; install.dat is a zip; installer file names; whether the installer writes into its own dir). (2) 'install on Linux.sh': does it forward \"$@\", any `read` prompts, terminal relaunch logic, stdin handling, the env it needs (TERM/DISPLAY?), and the effect of SMAPI_NO_TERMINAL/SMAPI_USE_CURRENT_SHELL. (3) 'install on Windows.bat': arg forwarding, `pause`/`set /p`, how it invokes SMAPI.Installer.exe, behaviour under `proton run cmd.exe /c`, and the Z:\\ path form for --game-path. (4) Proton: `proton run` env (STEAM_COMPAT_DATA_PATH, STEAM_COMPAT_CLIENT_INSTALL_PATH, SteamAppId/SteamGameId), whether it waits for exit, pressure-vessel/SLR requirement for recent Proton outside Steam, wineserver location, config_info format, config.vdf CompatToolMapping, appmanifest StateFlags meaning, loginusers.vdf MostRecent, localconfig.vdf apps/<appid>/LaunchOptions casing and escaping. (5) SMAPI's obsolete-file list and ~/.smapi behaviour. (6) Vessel packaging: is Vessel or a Flatpak manifest shipped (repo packaging files)? Does it need flatpak-spawn --host? Flatpak Steam roots. (7) Code boundaries: every install_archive and InstallOutcome call site, the deploy/plan.rs replaced-file classification, the backup store GC function, the startup recovery hook, the prompt.rs confirm flow, and whether libc or nix is already a dependency."
    wave: 1
    depends_on: []
    agent: gem-researcher
    exploration_mode: question
    status: completed
    blocker: "needs_input: both vendor scripts drop args (Linux.sh: no \"$@\", relaunches in GUI terminal when stdin not TTY; bat: no %*, ReadLine loop on null stdin). User must choose invocation strategy before T4a."
    retries_used: 0
    acceptance_criteria:
      - "The findings file /tmp/claude-1000/-home-jkempf-Repositories-modman/af51194a-7607-4280-a9ca-ab6ed9403978/scratchpad/loader-r1-findings.md answers items 1-7. Each answer cites a URL or file:line, or is marked unverified."
      - "An explicit verdict for each script: runs non-interactively and safely with argv X and env Y, or BLOCKER with the reason. A BLOCKER is returned as needs_input. It is not a recommendation to switch to the internal installer."
      - "Lists every install_archive and InstallOutcome call site, plus the backup GC function, with file:line."
    handoff:
      constraints: ["Read-only; no code edits; never run downloaded installers", "Write only the findings file"]

  - id: T1
