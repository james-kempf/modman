    title: SMAPI plugin and fixtures
    description: "New loaders/smapi.rs implementing LoaderPlugin. matches: the R1 layout signature. provenance: per decision (DownloadOrigin from a Vessel Nexus API or Pathoschild GitHub download only; layout and install.dat zip containing StardewModdingAPI.dll are always enforced; version from the folder name cross-checked with install.dat). plan: Install/Upgrade/Repair/Uninstall/Adopt build InstallerSpec{target=BashScript 'install on Linux.sh' | BatScript 'install on Windows.bat', args=[--install|--uninstall, --no-prompt, --game-path, GamePath|GamePathWin]} following R1's verdicts, with touch_scope and external_side_effects per decision; Proton adds Step::Launch(steam_launch_option). detect: managed/unmanaged/manual-install/drift. classify_vanilla(current, post, vanilla) -> Intact|SameVanilla|SteamUpdated. Fixture archives contain stub files only, for the internal/unix and internal/linux variants."
    wave: 3
    depends_on: [R1, T1, T2]
    agent: gem-implementer
    status: completed
    retries_used: 0
    context_cluster: loader_core
    acceptance_criteria:
      - "Both layout variants match. A missing internal/windows, a non-zip install.dat, or an install.dat without StardewModdingAPI.dll is a hard reject. Provenance is Verified only for Nexus API/2400 and Pathoschild GitHub origins; a local file or other origin is Unverified."
      - "The native plan target is 'install on Linux.sh' with the BashScript kind and the exact argv. The Proton plan target is 'install on Windows.bat' with the BatScript kind, Z:\\ game path and launch step. Uninstall plans with extracted=None use the cached archive."
      - "touch_scope includes every path listed in the decision. external_side_effects lists ~/.smapi."
      - "classify_vanilla has tests for all three outcomes. detect reports manual-install when StardewModdingAPI.dll or StardewValley-original exists with no loader_installs row."
      - "cargo test and clippy -D warnings pass."
