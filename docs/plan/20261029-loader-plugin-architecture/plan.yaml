  - id: T4b
    title: Loader orchestrator, consent token, phase-tracked runs, recovery
    description: "New app/loaders.rs, registered in app.rs. preview(game, source, op, unverified_ack): copy the archive to <data>/loaders/archives/<sha>, extract into a 0700 scratch dir, make it read-only, compute the manifest and plan_hash, and return a Preview{preview_id, plan_hash, argv list, env, cwd, runtime, touch_scope, external_side_effects, provenance, warnings, 'runs with your user permissions'}. run(preview_id, plan_hash): check the token, expiry and unverified_ack, re-verify the scratch manifest (and the cached archive sha for repair), run preflight and the vanilla classification (a Steam update refreshes the vanilla backup), take the deploy lock, then phase backing_up (scoped backup, persist the pre-manifest) -> spawned (persist pid/pgid/proc_start) -> diffing -> done, and record loader_installs/files/runs. On non-zero exit or timeout, roll back and set status=failed with the log kept. Then apply the launch step via launch.rs (desired set, ack pending). Ops: install, upgrade (keeps the original vanilla), repair, uninstall (vendor --uninstall, then the diff, falling back to rollback on failure or leftovers), adopt (ManualInstallDetected flow), rollback. Startup recovery per the phase decision, with the start-time check before killing. The declarative loaders' DeployFiles and Launch steps run through the same orchestrator using the existing deploy engine with root=game."
    wave: 4
    depends_on: [T4a, T3, S1]
    agent: gem-implementer
    status: completed
    note: "Deviations: declarative DeployFiles via orchestrator+confine (not deploy engine); startup recover() wiring left to T6; loader_installs.launch column added."
    retries_used: 0
    context_cluster: loader_core
    acceptance_criteria:
      - "Each spawning op (install, upgrade, repair, uninstall, adopt) with a missing, mismatched or expired token, a tampered scratch file, a changed cached archive, or an unverified plan without unverified_ack leaves FakeRunner calls == 0."
      - "Native e2e (FakeRunner): install records loader_files (StardewValley modified, StardewValley-original created, smapi-internal/** created); detect gives Installed+version; uninstall restores the vanilla; a non-zero exit triggers rollback and status=failed."
      - "Steam-update test: install -> replace StardewValley with vanilla V2 -> repair -> uninstall leaves StardewValley == V2 with the right hash. Upgrade keeps the original vanilla backup."
      - "Crash tests for each phase: backing_up refuses rollback and leaves the game unchanged; spawned kills the stored pgid only when proc_start matches (a reused-pid fixture is not killed) and then offers rollback; diffing completes the diff; done needs no action."
      - "Proton e2e: install sets launch_options_desired with acked NULL; Flatpak Steam or Unknown runtime gives typed errors."
      - "Adopt: the manual-install fixture is blocked on a normal install, adopt runs uninstall then install, and a non-ELF post-uninstall launcher is blocked."
      - "The BepInEx and SKSE fixtures install and uninstall end to end through the orchestrator (DeployFiles + Launch dll_overrides/exe) with no loader-specific core code."
      - "cargo test and clippy -D warnings pass."
    handoff:
      constraints: ["All spawning via ProcessRunner", "Deploy lock held for every mutating op", "Re-read app.rs before editing"]
      high_risk_signals: [security_sensitive, data_flow_change, shared_state]

