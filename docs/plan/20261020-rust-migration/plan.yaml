      - "Explicit pass/fail verdict on: purge restores byte-identical; crash recovery; key never logged; key fallback file 0600 in 0700 dir; deploy path traversal blocked; extraction cannot write outside the destination (.., absolute paths, symlink/hardlink entries, external-tool output validated)."
    handoff:
