    - "legacy/modman function map: game_preset 272 (presets 269-300), game_defaults 303, load_game 339, steam_roots/libraries/app_dir/prefix 388-433, detect_plugins_file 434, api_request 443, gql_query 494, ratelimit_summary 505, refresh_account 511, resolve_mod 555, archive_kind 593, extract_archive 612, layout_* 703-865, normalize_layout 866, fomod_py 941-1335, find_fomod/run_fomod 1336-1353, install_archive 1359, download/nxm 1431-1573, resolve_method 1574, build_plan 1586, link_one 1653, undeploy 1666, cmd_deploy 1738, cmd_purge 1899, cmd_verify 1949, cmd_conflicts 1994, plugins_update 2053, plugins_remove_managed 2103, collection_* 2125-2808 (collection_install 2328, collection_order_py 2249), deps_* 2915-3238, cmd_install..cmd_status 3323-4396, cmd_game 4080, cmd_login 4176, nxm_register 4230, nxm_handle 4276, autoupdate_* 4397-4774, usage 4892, main dispatch 4978."
    - "T01 findings: docs/plan/20261020-rust-migration/legacy_spec.md; T02 findings: docs/plan/20261020-rust-migration/spikes.md. Orchestrator copies summaries here before first consumer dispatch."
    - "T01 summary (c4a46a5): legacy never blocks deploy/purge while game runs (only autoupdate checks); config key fomod is dead; game set has 9 keys (folder, subdir, profile, appid, method, prefix, plugins-file, paks-dir, name); config has 9 keys with defaults in legacy_spec §3; auto deploy method = hardlink probe else copy (never symlink); manifest is \\x1f-separated 7 fields; purge order in legacy_spec §9; FOMOD choices stored Vortex-style; collections ordered by Kahn topo sort; deps cache 7-day TTL + 13 external tools; rate limit back-off 15/30/45s on 429. 12 ambiguities A1-A12 in legacy_spec §16."
    - "T02 summary (b75a089): libloot =0.29.7 pure Rust on crates.io (use Game::with_local_path), no runtime libs. RAR via compress-tools =0.16.1 + system libarchive (unrar crate rejected, licence). Keyring: keyring-core =1.0.1 + zbus-secret-service-keyring-store =1.0.1, file fallback, 3 s probe timeout. VDF: keyvalues-parser =0.2.4. reqwest =0.13.5 rustls-no-provider + rustls ring (no aws-lc). thiserror -> 2. Hand-rolled schema_migrations runner. nxm: Exec=modman nxm %u; CLI calls GUI over D-Bus (tauri-plugin-single-instance 2.5.4, org.modman.app.SingleInstance, ExecuteCallback) via zbus =5.19.0 with 5 s timeout, fallback = enqueue downloads row and process inline. No tauri-plugin-deep-link on Linux. Exact pinned versions per crate group in spikes.md §7; deny.toml bans unrar_sys, aws-lc-sys, openssl-sys, native-tls."
    - "Workspace: Cargo.toml default-members = core + cli; apps/desktop/src-tauri is a member outside default-members. Existing workspace deps: anyhow, thiserror 1, tracing, tracing-subscriber, clap 4 derive, serde, serde_json."
    - "Core module placeholders: crates/modman-core/src/{archive,deploy,download,error,fomod,games,loadorder,nexus,staging,store}.rs. Core never prints; progress via channel; thiserror in core, anyhow in binaries."
    - "Spec docs: linux_mod_manager_tech_stack.md (§4.1 deploy, §4.2 Nexus, §4.3 FOMOD/LOOT, §4.4 controller, §4.5 packaging, §5 schema, §9.1 game defs, §9.2 autoupdate), feature_parity_checklist.md (rows with MS column)."
    - "GLOBAL RULES: (1) commit once per completed task on branch rust-rewrite, no attribution trailers, no push; (2) stage only your own files with explicit `git add <paths>`, never `git add -A` or `git add .`; (3) report proving test names per checklist row in the task handoff; only T17 edits feature_parity_checklist.md; (4) SPDX 'GPL-3.0-or-later' header on new source files; (5) never modify a real game install or ~/.steam; (6) after W2, Cargo.toml, error.rs and migrations are frozen for W3 tasks: if something is missing, stop and report."

tasks:
  - id: T01
    title: Legacy behaviour audit (checklist §9 code-reads)
    description: |
      Read legacy/modman and produce a porting spec. Covers checklist §9 items 1-6 plus everything
      consumers need: full command/alias/flag inventory (usage + dispatch), game preset table and
      per-game config keys (cmd_game), config keys and defaults, layout profile rules, deploy/backup/
      manifest/undeploy algorithm, FOMOD modes (collection/reuse/ask/default) and choice storage,
      collection install/order rules, deps data sources, external tool list and ack/unack semantics,
      rate-limit and adult handling, game-running checks, autoupdate state machine (incl. last-run
      log), plugins.txt formats, nxm register/handle flow. Rung: reuse (reading only).
    wave: 1
    depends_on: []
    agent: gem-researcher
    exploration_mode: audit
    status: completed  # c4a46a5 legacy_spec.md
    retries_used: 0
    acceptance_criteria:
      - "docs/plan/20261020-rust-migration/legacy_spec.md exists with one section per checklist §9 item (1-6), each citing legacy/modman line ranges."
      - "Command inventory table lists every subcommand, alias and flag found in usage() and main dispatch, with line references."
      - "Game preset table reproduces all presets from lines 269-300 (domain, appid, subdir, profile, extras) suitable for direct TOML conversion."
      - "Deploy section documents method resolution, backup handling, manifest format and purge restore order; FOMOD section documents each mode and where choices persist."
      - "deps section documents requirement data source, external-tool list and ack/unack persistence and effect on reports."
      - "Lists unlisted behaviours (rate limit, adult, notifications, lock) and whether legacy blocks deploy while the game runs."
    handoff:
      constraints:
        - "Read-only; do not modify legacy/."
        - "Facts with line refs only; no design proposals beyond flagging ambiguities."

  - id: T02
    title: External dependency spikes and cross-cutting decisions
    description: |
      Resolve tech-stack §7 spikes answerable without hardware: (1) libloot from Rust - upstream Rust
      crate/git dependency, else C++ FFI (cmake+boost present); build a throwaway compile test in the
      scratchpad; record bundling impact for AppImage/Flatpak. (2) RAR: unrar crate vs shelling out to
      7z/unrar (licensing, native deps). (3) keyring crate Secret Service behaviour and file fallback
      trigger. (4) VDF/KeyValues parser crate. (5) nxm routing: how the CLI `modman nxm <url>` reaches a
      running GUI (e.g. single-instance plugin socket/D-Bus, or launching the GUI binary which forwards)
      and the single .desktop Exec target (binary + %u quoting) used by T07/T13/T15. (6) Pinned crate
      list with exact versions: rusqlite (bundled vs system) + migration approach, reqwest+rustls, tokio,
      zip, sevenz-rust, reflink-copy, quick-xml, toml, keyring, vdf parser, directories, rustix/nix
      (st_dev, flock), sha2, wiremock/mockito, assert_cmd, tempfile, tauri-plugin-single-instance,
      tauri-plugin-deep-link (v2). Rung: platform/stdlib decision support.
    wave: 1
    depends_on: []
    agent: gem-researcher
    exploration_mode: question
    status: completed  # b75a089 spikes.md; libloot buildable: yes
    retries_used: 0
    acceptance_criteria:
      - "docs/plan/20261020-rust-migration/spikes.md records decision + evidence (crate version, licence, build result) for libloot, RAR, keyring, VDF parser and nxm routing."
      - "libloot section ends with an explicit line 'libloot buildable: yes|no' plus the exact integration path (git dep rev or FFI build recipe) and runtime libs to bundle."
      - "nxm routing section names the Exec line verbatim and the CLI->GUI forwarding mechanism, with fallback when no GUI is running (enqueue in downloads table)."
      - "Dependency table lists each crate with exact version and licence, all GPL-3.0-or-later compatible, split into core deps, core dev-deps, cli deps, desktop deps."
    handoff:
      constraints:
        - "Prototype only in the scratchpad; do not edit workspace files."
        - "No sudo."
      high_risk_signals: [architecture]

  - id: T03
    title: "M1 core foundation: deps, all migrations, errors, config, game definitions, Steam detection, CLI skeleton"
    description: |
      Pre-allocate every core/cli dependency T02 pins for waves 2-3 (workspace + core + cli Cargo.toml,
      incl. dev-deps) and all migrations: tech stack §5 tables (games, profiles, mods, mod_files,
      deployments, downloads, collections, schema_migrations) plus deploy_journal, backups, updates_cache,
      ratelimit, fomod_choices, deps_ack, settings, autoupdate_state/last-run log. error.rs: top-level
      Error with #[from] wrapping stubs for each module error (ArchiveError, StagingError, DeployError,
      NexusError, DownloadError, FomodError, LoadOrderError, StoreError, GamesError); stub enums declared
      in each module file for W3 owners to fill. store.rs (rusqlite, WAL, embedded migrations), deploy
      lock (flock), global config, games.rs Steam detection (libraryfolders.vdf incl. SD card,
      appmanifest acf, compatdata prefix, buildid), game definitions as embedded TOML for all legacy
      presets with a support field (tested for Skyrim SE, experimental otherwise) and user override dir;
      tracing to file. CLI: global -g/--game, -y/--yes, --no-color (+NO_COLOR), --debug; help, version,
      all legacy aliases; game detect/add/list/use/info/set/remove (remove refuses when deployment
      active), config, log [-f] [lines]; legacy-state warning. CLI split into commands/<group>.rs.
      Rung: reuse crates pinned by T02.
    wave: 2
    depends_on: [T01, T02]
    agent: gem-implementer
    context_cluster: port-baseline
    status: completed  # eb516c7; 66 tests
    retries_used: 0
    acceptance_criteria:
      - "Cargo.toml files contain every core/cli crate and dev-dep from spikes.md table at the pinned versions; `cargo build` and `cargo test` compile."
      - "All listed migrations apply on an empty DB and are idempotent on re-open (test); test asserts every listed table exists."
      - "error.rs has #[from] conversions for each listed module error; each module file declares its stub enum."
      - "One TOML game definition per legacy preset embedded; test loads all and asserts Skyrim SE: domain skyrimspecialedition, appid 489830, subdir Data, profile bethesda, plugins format star, support tested; every other preset support experimental."
      - "Steam detection test parses fixture libraryfolders.vdf (2+ libraries incl. SD-card path) and appmanifest acf files, returning install dir, prefix path and buildid."
      - "CLI integration tests (assert_cmd) cover every alias and global flag from the legacy_spec.md inventory in M1 scope; help/version exit 0; NO_COLOR honoured."
      - "game set accepts exactly the key list from legacy_spec.md item 1; config accepts the 9 documented keys; unknown keys exit non-zero."
      - "Legacy-state warning emitted when ~/.config/nexus-mod-manager exists (test with temp HOME)."
      - "cargo test, cargo clippy --all-targets -- -D warnings, cargo fmt --check pass; handoff lists proving test names per checklist row."
    handoff:
      constraints:
        - "Core does no printing; CLI renders."
        - "Data dir via XDG; tests use temp HOME/XDG dirs."
        - "No v2->v3 config migration (Drop row)."
        - "Layout profile referenced by name string; the enum/rules live in staging.rs owned by T04."
      high_risk_signals: [schema_change, architecture]

  - id: T04
    title: "Archive extraction and layout normalization"
    description: |
      archive.rs: zip, 7z, rar extraction per T02 decision, archive kind detection, typed error when the
      7z/unrar tool is missing, hardened extraction: reject '..', absolute paths, symlink and hardlink
      entries; validate trees produced by external tools (no symlinks, no escapes) before staging.
      staging.rs: per-mod layout normalization, case-insensitive directory merge, layout profiles
      bethesda, cyberpunk, stardew, bannerlord, witcher3, bepinex, melonloader, ue, generic ported from
      legacy layout_* / normalize_layout, doc filtering, per-file hash list for mod_files.
      Rung: reuse crates; port legacy rules.
    wave: 3
    depends_on: [T03]
    agent: gem-implementer
    context_cluster: port-baseline
    status: completed  # f11bc64
    retries_used: 0
    acceptance_criteria:
      - "Extraction tests for zip, 7z and rar fixtures pass."
      - "Entries with '..' or absolute paths are rejected for zip, 7z and rar (tests)."
      - "Symlink and hardlink entries are rejected for zip, 7z and rar (fixture tests); nothing is written outside the destination."
      - "Post-extraction validator test: a tool-extracted tree containing a symlink or escaping path is rejected before staging."
      - "Missing 7z/unrar binary (PATH override in test) yields a typed ArchiveError naming the tool."
      - "Each of the 9 layout profiles has at least one unit test matching the rule in legacy_spec.md."
      - "Case-insensitive merge test: 'data/Textures' and 'Data/textures' merge into one canonical directory."
      - "cargo test, clippy -D warnings, fmt --check pass; handoff lists proving test names."
    handoff:
      constraints:
        - "Edit only archive.rs, staging.rs and their tests/fixtures."
        - "Use the module-local error enums declared by T03; do not edit error.rs, Cargo.toml or migrations; if something is missing, stop and report."
        - "Expose LayoutProfile enum with FromStr matching profile names in game TOML."
      high_risk_signals: [security_sensitive]

  - id: T05
    title: "M2 deploy engine: per-library staging, link fallback, backups, journal, purge, verify"
    description: |
      deploy.rs: staging location under <library>/.modman/staging; deploy plan from profile order with
      one winner per path; target game_dir or prefix_dir per definition; method chain hardlink ->
      reflink -> symlink -> copy with st_dev check, per-file method recorded; content-addressed backup
      store for replaced game files; SQLite-journaled transaction with resume/rollback on next launch;
      purge restores originals byte-identical; verify; dry-run; refuse deploy/purge while the game runs;
      deploy lock. CLI: deploy [--dry-run] [--method], purge/undeploy, verify, status/st.
      Rung: stdlib fs + reflink-copy.
    wave: 3
    depends_on: [T03]
    agent: gem-implementer
    context_cluster: port-baseline
    status: completed  # 8acc2c3
    retries_used: 0
    acceptance_criteria:
      - "Fixture test: snapshot temp game dir (path+sha256+mode), deploy N mods with overlapping files and overwritten originals, purge, snapshot equals original byte-for-byte."
      - "Crash-recovery test: deploy aborted after K files via injected failure; next open rolls back (or resumes) and post-purge snapshot equals original."
      - "Fallback test: forced hardlink failure (injected or cross-device temp dirs) records reflink/symlink/copy per file in deployments table."
      - "Conflict test: later-priority mod wins each contested path; conflicts listed by core API."
      - "Deploy refused with typed error when game process detected (mocked probe) and when deploy lock held."
      - "verify reports modified/missing deployed files; --dry-run changes nothing on disk (test)."
      - "cargo test, clippy -D warnings, fmt --check pass; handoff lists proving test names."
    handoff:
      constraints:
        - "Edit only deploy.rs, commands/deploy.rs (and status) and their tests; staging trees are consumed as plain directories (do not edit staging.rs)."
        - "Use the module-local error enum; do not edit error.rs, Cargo.toml or migrations; if something is missing, stop and report."
        - "Tests only touch tempfile dirs. Backups written and fsynced before any game file is replaced."
      high_risk_signals: [irreversible, data_flow_change, schema_change]

  - id: T06
    title: "M3 Nexus client, auth, downloads (core only)"
    description: |
      nexus.rs: REST v1 + GraphQL v2 client (reqwest+rustls), AuthProvider trait with API key impl,
      key storage in keyring with fallback to a 0600 file inside a 0700 directory when Secret Service
      is unavailable, key validation + premium detection, x-rl-* rate-limit parsing with persisted
      state and throttling, mod/file info, download links (premium direct, nxm key+expires exchange),
      updates via updated endpoints cached in SQLite, search (GraphQL), mod batch query for deps,
      adult-content setting. download.rs: resumable streaming downloads with progress events, nxm:// URL
      parser (mods and collections/revisions; the single parser reused by CLI and GUI), downloads
      queue/intake. Rung: reuse reqwest/keyring.
    wave: 3
    depends_on: [T03]
    agent: gem-implementer
    context_cluster: port-baseline
    status: completed  # e8d75c8
    retries_used: 0
    acceptance_criteria:
      - "All HTTP tests use a mock server; zero requests to api.nexusmods.com in test runs."
      - "Tests: key validation success/401, premium vs free download-link path, nxm URL parse (mod and collection revision forms, malformed/foreign-host input rejected), key+expires exchange."
      - "Rate-limit test: headers below threshold cause throttling/typed error; state persists across client instances."
      - "Resume test: interrupted download resumes with Range and final sha matches."
      - "Keyring fallback test: with keyring backend unavailable (mock), key is stored in a 0600 file inside a 0700 directory; permissions asserted."
      - "API key never appears in logs or error strings (test asserts on captured tracing output)."
      - "cargo test, clippy -D warnings, fmt --check pass; handoff lists proving test names."
    handoff:
      constraints:
        - "Edit only nexus.rs, download.rs and their tests; no CLI files."
        - "Use the module-local error enums; do not edit error.rs, Cargo.toml or migrations; if something is missing, stop and report."
        - "Base URLs injectable for tests. No OAuth2/SSO implementation; trait only."
      high_risk_signals: [security_sensitive]

  - id: T07
    title: "M3 CLI mod management and Nexus commands"
    description: |
      Wire core into CLI: login (API key from no-echo prompt or stdin, never argv) / logout, install
      <id|url|nxm|file> [--file] [--deploy], download, list [text] [-e|-d] [-c], info, enable/disable
      [--all|--collection], order (#, first, last, up, down, before, after), uninstall
      [--delete-archive], conflicts [mod] [--files], deps [--refresh] + ack/unack, updates [--install]
      [--all], search, profile list/save/load/delete, clean, launch/play/run (steam://rungameid, offer
      deploy), nxm register/unregister (.desktop + mimeapps using the T02 Exec target) and nxm <url>
      (core nxm parser, then T02 forwarding mechanism or enqueue). Mod reference resolution with 5
      forms and ambiguity errors listing matches. Rung: reuse core APIs.
    wave: 4
    depends_on: [T04, T05, T06]
    agent: gem-implementer
    context_cluster: port-baseline
    status: completed  # 4d29d80; 300 tests
    retries_used: 0
    acceptance_criteria:
      - "Mod reference resolver tests: #N, full id, exact name, Nexus mod id, unique substring, and ambiguous substring error listing all matches."
      - "CLI integration tests (temp HOME + mock Nexus) for install from local archive, install by Nexus id via mocked premium link, enable/disable, order variants, uninstall, profile save/load roundtrip."
      - "login test: key supplied via stdin is stored; test asserts the key never appears in process args, stdout or stderr; no flag accepts the key."
      - "deps test: requirement report lists external tools; ack marks a tool satisfied, unack reverts, persisted across runs."
      - "nxm register writes the T02 Exec line with correct %u quoting and MimeType=x-scheme-handler/nxm; under temp XDG dirs; unregister removes both .desktop and mimeapps entries."
      - "Every command/alias/flag in scope from legacy_spec.md has an assert_cmd test."
      - "cargo test, clippy -D warnings, fmt --check pass; handoff lists proving test names per checklist row."
    handoff:
      constraints:
        - "--fomod and reinstall --ask parse but return a typed 'not yet' error until T09a."
        - "Edit only crates/modman-cli and thin core glue; no changes to archive/staging/deploy/nexus internals (T08 reviewing)."

  - id: T08
    title: "Security and irreversibility review: archive, staging, deploy, Nexus auth"
    description: |
      Independent review of T04, T05, T06: extraction confinement, purge byte-identity, journal
      recovery, backup ordering, symlink/path traversal in deploy targets, TOCTOU, lock handling; API
      key storage, log leaks, TLS config, nxm URL handling, rate-limit correctness. Rung: review only.
    wave: 4
    depends_on: [T04, T05, T06]
    agent: gem-reviewer
    status: completed  # verdict blocking: 2 HIGH (deploy symlink escape, purge identical-content restore), findings T10-1..12 -> T10
    retries_used: 0
    acceptance_criteria:
