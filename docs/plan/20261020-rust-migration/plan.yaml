plan_id: 20261020-rust-migration
status: in_progress
tldr: |
  Rust rewrite of modman (M1-M7) in 11 waves; max 2 concurrent agents (orchestrator throttles waves with 3 tasks).
  W1 research (legacy audit + dependency spikes) -> GATE (libloot buildable?) -> W2 core foundation (deps, all migrations, errors, CLI skeleton)
  -> W3 archive/layout + deploy engine + Nexus client -> W4 CLI mod management + security/irreversibility review
  -> W5 FOMOD + review remediation -> W6 collections -> W7 LOOT/plugins.txt + autoupdate
  -> W8 Tauri backend -> W9 React frontend + packaging/CI + security review of nxm/login/Tauri surface
  -> W10 GUI E2E test -> W11 parity and quality gate (sole checklist editor).
created_at: "2026-10-20"
created_by: gem-planner
revision: 2
replan_count: 0
planner_revision_used: true

decisions:
  - "Two gem-researcher tasks in W1 (legacy code-read vs external dependency spikes): disjoint sources, run in parallel, both feed the port-baseline cluster."
  - "ORCHESTRATOR GATE after W1: if spikes.md says libloot is unbuildable on this machine by every path (Rust dep, C++ FFI), stop and escalate to the user before dispatching W2. No CLI/skip fallback is planned."
  - "T03 runs alone in W2 and pre-allocates every core dependency T02 pins (workspace + core Cargo.toml, incl. dev-deps), all SQLite migrations and #[from] error stubs, so the three W3 tasks never touch shared files."
  - "T04/T05/T06 run in W3 on disjoint files (archive.rs+staging.rs / deploy.rs / nexus.rs+download.rs) with module-local error enums; missing deps or tables -> stop and report, never edit shared files."
  - "Per-library staging location lives in deploy.rs (T05); staging.rs (T04) owns layout normalization only."
  - "Nexus core (T06) does not touch CLI; all mod-management CLI wiring is coalesced into T07."
  - "Independent gem-reviewer audit (T08) of archive/staging/deploy/auth before more features build on them; remediation is its own task (T10) so retry blast radius stays narrow."
  - "FOMOD (T09a, W5, parallel with T10) split from collections (T09b, W6) because collections consume FOMOD choices and the remediated Nexus client."
  - "CLI split into crates/modman-cli/src/commands/<group>.rs in T03 so parallel tasks edit disjoint files."
  - "OAuth2/SSO not implemented: checklist marks it 'later' and acceptance criteria require API key only; T06 delivers the AuthProvider trait so SSO can plug in."
  - "GUI split into Tauri backend (T13) and React frontend (T14): frontend consumes T13's typed command contract. T13 owns tauri.conf.json; T15 depends on T13 and edits only its bundle section."
  - "nxm forwarding path (how `modman nxm <url>` reaches a running GUI) and the single nxm .desktop Exec target are decided once in T02; T07/T13/T15 implement that decision."
  - "Second read-only review T13R (W9) covers the user-facing attack surface: nxm .desktop registration, login key input, Tauri deep-link/capabilities/CSP; findings feed T17."
  - "Packaging (T15, gem-devops) also owns CI workflow, deny.toml, runtime-dep bundling and packaging README (Deck shortcut, Steam Input keyboard layout fallback); no separate docs task."
  - "Only T17 edits feature_parity_checklist.md, from proving test names reported in each implementer handoff (avoids parallel edit conflicts)."
  - "Paired tester only for the GUI (T16); core/CLI verification is TDD inside each implementer task plus the final gate (T17), which runs last in its own wave after T16."
  - "Only the bethesda profile (Skyrim SE) gets end-to-end coverage in v1; other presets get unit tests for layout/definitions and ship labelled experimental."
  - "Drop rows (v2->v3 migration, ui server, ui-state/detect/thumbs, token server security, cron/autostart, --scheduler) are excluded everywhere; T17 checks by grep."

assumptions:
  - "System packages installed: webkit2gtk4.1-devel 2.54, javascriptcoregtk4.1-devel, libsoup3-devel, libappindicator-gtk3-devel, librsvg2-devel, sqlite-devel, libarchive-devel, unrar, cmake, boost-devel, 7zip, gcc-c++. GUI tasks are scheduled by dependency only."
  - "libloot is not packaged; cmake + boost + gcc-c++ make a from-source C++ build feasible if a Rust path is not."
  - "Rust 1.99.1 at ~/.cargo/bin (export PATH=$HOME/.cargo/bin:$PATH); node 24 via nvm."
  - "No real Nexus API key or Steam Deck: network tested with mocked HTTP; Deck behaviour verified only via 1280x800 viewport + keyboard/gamepad emulation. Real-library and SD-card deploys remain unverified (recorded as residual risk by T17)."
  - "Local Skyrim SE under ~/.steam may be used for read-only detection checks only; all deploy/purge tests use temp dirs."

