      high_risk_signals: [security_sensitive, irreversible]

  - id: T09a
    title: "M5 FOMOD installer"
    description: |
      fomod.rs: quick-xml parse of fomod/ModuleConfig.xml into steps/groups/options with conditions,
      flag dependencies, install plan; recorded choices persisted in fomod_choices; modes ask/default
      (and collection/reuse resolution API per legacy_spec.md); resolver trait for CLI prompts and GUI
