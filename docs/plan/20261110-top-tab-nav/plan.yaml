        - "Do not touch App.tsx, nav/*.ts, store.ts, or src/index.css (owned by T2/T3). If an easing/keyframe token is truly needed, report it so T2/T3 add it."
        - "csp.test.ts rules apply to all sources."
      relevant_context:
        - "DialogTabs: src/components/dialogs/BrowseDetails.tsx ~lines 125-215; MOD_TABS usage above it."
        - "Segmented.tsx is NOT the tab component and must not change."
      critic_signals: [architecture]

