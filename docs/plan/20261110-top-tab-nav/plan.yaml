plan_id: 20261110-top-tab-nav
status: pending
tldr: |
  Replace the App.tsx left Sidebar with a two-row top header. Row 1 (context): brand, active game name (truncated),
  deploy progress, account chip, Quit. Row 2: full-width single-line tablist of all 8 VIEWS with LB/RB glyphs at its
  ends. The tablist is the existing DialogTabs (BrowseDetails.tsx) extracted to components/ui/controls/Tabs.tsx and
  extended (variant, icon, badge, glyph adornments as siblings of the tablist, focusable roving mode, per-tab
  scaleX+opacity underline). A separate html[data-pad] flag drives glyph visibility. LB/RB/PageUp/PageDown keep routing
  through performNav "tab" (dialog scope first, then views; store.cycleView already wraps).
created_at: 2026-11-10
created_by: gem-planner
revision: 2
replan_count: 0
planner_revision_used: true

baseline:
  objective: "In the desktop app (Tauri + React + Tailwind, apps/desktop/src, branch rust-rewrite), replace the left sidebar nav with a top-level tab system, navigable with gamepad LB/RB, showing LB/RB glyphs in controller mode, built by reusing and extending the existing tab component, with a modernized look."
  acceptance_criteria:
    - "Sidebar replaced by a top horizontal tab bar covering every top-level destination; game context (GameHeader etc.) moved somewhere sensible."
    - "Built from the existing tab component, extended; existing usages keep working."
    - "Gamepad LB/RB cycle tabs; keyboard equivalents kept; wrap-around and dialog-open suppression defined; existing LB/RB meanings resolved explicitly; LT/RT stay Browse paging."
    - "LB/RB glyphs at the tab bar ends only in controller mode; hidden for mouse/keyboard; aria-hidden; not focusable."
    - "Spatial nav works with nav/spatial.ts regions; focus return; Escape returns to the tab; role=tablist/tab, aria-selected, roving tabindex."
    - "Modernized look within existing tokens: transform/opacity-only animated indicator, cubic-bezier(0.16,1,0.3,1) ~200-300ms, reduced motion respected, :active feedback, no emojis/glows/purple gradients, one accent; no new deps unless justified."
    - "Full width used; views lay out correctly; Browse sticky pager and --main-pb keep working; <main> stays scroll container."
    - "Tests updated; tsc clean; vitest passes except known pre-existing failures (App.test PageDown/PageUp one to be fixed/replaced); vite build succeeds; WebKitGTK real-geometry check."
  captured_at: 2026-11-10

decisions:
  - "Existing tab component = DialogTabs (src/components/dialogs/BrowseDetails.tsx, the only role=tablist). Extract to src/components/ui/controls/Tabs.tsx, export from ui/index.ts, BrowseDetails consumes it. Segmented (pill group, aria-pressed) is a different control and stays untouched (reuse rung: extend existing)."
  - "Header layout is TWO ROWS (user-selected). Row 1 (context): brand, game name (truncate), deploy progress, account chip, Quit. Row 2: full-width tablist on one line, LB/RB glyphs at its ends."
  - "Tab-bar fit at narrow widths (1024px): first tighten tab padding/gap (responsive classes) so all 8 tabs keep icon+label on one line; if they still do not fit, the tablist scrolls horizontally (overflow-x-auto, hidden scrollbar) with the selected/focused tab kept in view via scrollIntoView({inline:'nearest'}). Never wrap to a second line, never drop labels."
  - "Indicator = option B: per-tab underline element that animates transform scaleX plus opacity via classes only (scale-x-0 opacity-0 -> scale-x-100 opacity-100 on aria-selected), transition-[transform,opacity] ease-[cubic-bezier(0.16,1,0.3,1)] duration-[250ms] motion-reduce:transition-none. No measured/sliding indicator (csp.test forbids style={...} and .style.* writes)."
  - "Controller mode: keep html[data-input] (pointer|nav) unchanged for the focus ring; add orthogonal html[data-pad] set by the gamepad loop on non-scroll actions, cleared by keyboard nav keys and pointer input; Tailwind @custom-variant pad in index.css (owned by T2). Accepted behaviour: data-pad may flicker under Steam Input keyboard/mouse mapping (pad emulating keys/mouse clears it); not mitigated."
  - "LB/RB semantics explicit: performNav 'tab' -> dialog TAB_EVENT when a dialog scope is open (dialog tabs switch, app views never), else useUi.cycleView. useUi.cycleView (store.ts ~231) already wraps ((i+delta+len)%len): last->first, first->last; no store change expected. No in-view sub-tab uses LB/RB (Segmented has no TAB_EVENT listener), so no clash. PageUp/PageDown map to the same action. LT/RT stay PAGE_EVENT."
  - "Top tabs: roving tabindex (selected tab tabindex=0, others -1) following the APG manual-activation pattern: tabindex=0 stays on the selected tab and does not follow focus. Arrow/D-pad Left/Right moves focus between tabs, A/Enter/click activates, LB/RB select directly and focus the new tab. spatial.ts gets an explicit exemption (marker attribute, e.g. data-nav-roving) so the -1 tabs remain spatial-nav candidates. Dialog tabs (tabindex=-1, not focus stops) keep current behaviour."
  - "LB/RB glyphs are siblings of the role=tablist element inside a wrapper (start/end adornments around the tablist), never children of it, so tablist owns only role=tab children."
  - "No new dependencies: @phosphor-icons/react reused (ICON map); no framer-motion. Glyphs are mono-font keycap spans from existing tokens."
  - "Header is a non-scrolling sibling above <main>; <main> stays the scroll container so --main-pb/STACK_ROOM and the Browse sticky pager are untouched. HeroBackdrop stays behind <main>."
  - "Accepted defaults: Quit and account chip move to header row 1; the 'LB/RB or PgUp/PgDn switch tabs' hint line is dropped; dialog tabs get no glyphs (Tabs API supports them)."
  - "File ownership: T1 owns components (Tabs.tsx, BrowseDetails.tsx, ui/index.ts, ui tests) and must not touch src/index.css; T2 owns nav/modality.ts, nav/gamepad.ts, src/index.css (pad variant plus any easing/keyframe tokens T1 needs); T3 owns App.tsx, nav/actions.ts, nav/spatial.ts, store.ts if needed, and tests."
  - "No researcher task: discovery already located all owners (see shared_context)."

assumptions:
  - "Top-level destinations are exactly VIEWS in src/app/store.ts: games, overview, browse, mods, collections, requirements, activity, settings."
  - "--spacing-sidebar (index.css) becomes unused; T3 may remove that single token line (only index.css edit outside T2, after T2 completes)."
  - "User is concurrently editing files (Games.tsx, Overview.tsx seen). Working tree was clean at plan time. Every task re-checks git status/diff before editing and merges around user edits; no commits."
  - "Known pre-existing failures: src/style.test.ts 'paints the highlight...' (out of scope) and src/app/App.test.tsx 'PageDown/PageUp switch tabs...' (in scope: rewritten in T3)."
  - "Tailwind arbitrary classes (ease-[...], duration-[250ms]) suffice for motion, so T1 likely needs no index.css tokens; if it does, T2 adds them."

shared_context:
  shell_nav:
    - "App.tsx: Sidebar() = GameHeader (Brand, game name, deploy progress; sticky top-0 z-10 bg-ink) + TabRail (nav aria-label=Views data-nav-rail, buttons data-tab={id} aria-current=page, ICON map of phosphor duotone icons, Activity badge running+prompts) + Quit (data-nav-rail) + AccountFooter. Initial focus: querySelector('[data-tab][aria-current=page]')."
    - "nav/actions.ts: focusCurrentTab() selects [data-tab][aria-current='page']; 'tab' case: navScope!=body -> TAB_EVENT on dialog scope, else cycleView(delta) then focus [data-tab='{view}']; keyboard PageUp/PageDown -> {type:'tab'} (lines ~134-153)."
    - "store.ts: cycleView wraps via (i + delta + VIEWS.length) % VIEWS.length."
    - "nav/spatial.ts: focusables exclude [tabindex='-1']; region = closest(nav,header,main,aside,[role=dialog]) with same-landmark preference; inRail = closest([data-nav-rail]) - designed for a vertical left rail; must be re-checked for a horizontal top bar."
    - "nav/modality.ts: html[data-input] pointer|nav; gamepad.ts ~line 194 setModality('nav') on non-scroll actions; BUTTON LB=4 RB=5 emit {type:'tab',delta:+-1}."
    - "index.css: @custom-variant highlighted / in-highlight keyed on html[data-input=nav]; --spacing-sidebar: 268px."
    - "csp.test.ts forbids /\\bstyle=\\{/, <style, and .style.* writes in sources."
    - "Tests referencing sidebar/data-tab/aria-current/nav-rail: src/app/App.test.tsx, src/ct1.test.tsx, src/ct2.test.tsx, src/views/views.test.tsx, src/views/Games.test.tsx, src/nav/spatial.test.ts; src/views/Games.tsx also references one of these selectors."

tasks:
