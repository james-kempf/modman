    title: Extract and extend the Tabs component
    description: "Rung: reuse/extend existing. Move DialogTabs out of BrowseDetails.tsx into src/components/ui/controls/Tabs.tsx (exported via ui/index.ts) and extend it: variant 'underline' (current dialog look, default) and 'nav' (top bar); per-tab icon and badge slots; start/end adornment slots rendered as siblings of the role=tablist inside a wrapper (for glyphs); 'focusable' mode with roving tabindex (APG manual activation) + spatial-nav marker attribute (default stays tabindex=-1, not a focus stop); per-tab data attribute (data-tab) so the shell can target tabs; per-tab underline indicator animating scaleX+opacity by classes only; :active feedback. TAB_EVENT listener stays for the dialog usage only (opt-in or scope-guarded so it never attaches at document/body level). In 'nav' variant, keep the focused/selected tab scrolled into view (inline:'nearest') for the horizontal-scroll fallback."
    wave: 1
    depends_on: []
    agent: gem-implementer
    status: pending
    retries_used: 0
    context_cluster: shell_nav
    acceptance_criteria:
      - "src/components/ui/controls/Tabs.tsx exists and is exported from src/components/ui/index.ts; BrowseDetails.tsx imports it and no longer defines its own tablist."
      - "Default/dialog variant keeps the current dialog tab widths and visuals (flex-1 truncate tabs, border-b-2 accent-400 on selected, same padding/typography); no equal-width-grid layout change; BrowseDetails behaviour unchanged: role=tablist/tab, aria-selected, aria-controls/tabpanel ids, tabindex=-1, mouse-down does not focus, LB/RB via TAB_EVENT wraps, panel refocus on switch; existing BrowseDetails/browse tests pass unchanged or with selector-only updates."
      - "Focusable mode: exactly one tab has tabindex=0 and it is the selected tab; moving focus to another tab (focus() or arrow) does NOT move tabindex=0 (APG manual activation); activating (click/Enter) moves selection and tabindex=0 together; unit test asserts all three."
      - "Indicator: a per-tab element with classes scale-x-0 opacity-0 when unselected and scale-x-100 opacity-100 when aria-selected, transition limited to transform and opacity, ease-[cubic-bezier(0.16,1,0.3,1)] duration-[250ms] motion-reduce:transition-none; no style={...} or .style writes (csp.test passes)."
      - "Start/end adornments render outside the role=tablist element (siblings in a wrapper), aria-hidden=true, no tabindex, not buttons; tablist children are only role=tab elements; unit test asserts this."
      - "src/index.css is not modified by this task; no new package.json dependencies; only existing tokens (ink, hairline, fill, accent-*, spacing, fonts); no emojis, glows, or gradients."
      - "New unit tests for Tabs in src/components/ui/ui.test.tsx or a sibling Tabs.test.tsx cover variants, slots, roving tabindex, aria-selected."
    handoff:
      constraints:
