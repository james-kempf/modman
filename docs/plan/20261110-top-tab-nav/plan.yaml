  - id: T4
    title: WebKitGTK real-geometry and interaction verification
    description: "Independent verification of layout and motion in the real engine using the scratchpad geo scripts (wk.py, app.py, tiles.py) against vite preview."
    wave: 3
    depends_on: [T3]
    agent: gem-browser-tester
    status: pending
    retries_used: 0
    acceptance_criteria:
      - "At 1280x800 and 1024x640: document and header have scrollWidth <= clientWidth (no page-level horizontal overflow); header is two rows; all 8 tabs are on one line (identical top for every role=tab rect) and each shows its label (label element width > 0, not clipped: scrollWidth <= clientWidth); the game name element truncates (text-overflow ellipsis, its rect does not exceed row 1)."
      - "If at 1024x640 the tabs exceed the tablist width, the fallback is verified: tighter padding applied, tablist is horizontally scrollable, and after selecting the last and first tab via LB/RB the selected tab rect lies fully within the tablist rect. Otherwise report that the fallback was not triggered."
      - "Header does not scroll with <main>; views use the freed width up to max-w-content."
      - "Browse sticky pager stays pinned to the bottom of <main> with 0, 1, and 3+ bottom-stack items (--main-pb mechanism), measured via getBoundingClientRect."
      - "Selected tab's underline rect lies within the tab rect after switching; computed transition-property of the indicator contains only transform and/or opacity, timing function cubic-bezier(0.16, 1, 0.3, 1), duration 0.25s."
      - "Reduced motion: in wk.py set Gtk.Settings gtk-enable-animations=False before load (WebKitGTK maps it to prefers-reduced-motion) and assert matchMedia('(prefers-reduced-motion: reduce)').matches and computed transition-duration of the indicator is 0s (or transition-property none). If the media query does not match under that setting, instead verify the built CSS contains the motion-reduce media rule that applies transition-property:none to the indicator class (inspect document.styleSheets), and report which method was used."
      - "With data-pad set, LB/RB glyphs are visible at both ends of the tab row (outside the tablist); with data-input=pointer or keyboard-only use they are display:none; glyphs never receive focus."
      - "Overview HeroBackdrop and focus ring (data-input=nav) render correctly with the new header; screenshots saved under the scratchpad geo/ folder and paths reported."
