  - id: T3
    title: Two-row top header shell, nav wiring, layout, tests
    description: "Rung: reuse T1 Tabs + existing App.tsx pieces (Brand, GameHeader content, ICON, badge, AccountFooter, Quit). Replace Sidebar with a two-row <header> above <main>: row 1 brand, active game name (truncate), deploy progress, account chip, Quit; row 2 the T1 Tabs in 'nav' variant, focusable mode, icons + labels, Activity badge, LB/RB keycap glyphs as start/end adornments visible only under the pad variant. Narrow-width rule: tighter padding/gap first, then horizontal scroll of the tablist with the selected/focused tab kept in view; never wrap. Wire nav: focusCurrentTab, performNav 'tab' focus target, initial focus all target the selected top tab (role=tab aria-selected=true). Update spatial.ts for the horizontal bar (honour the roving marker; Up from top of view lands on the SELECTED tab; Down from bar enters view; Left/Right moves between tabs and header controls; shell header and view-internal <header> landmarks do not trap Up/Down). Drop the hint line. Remove --spacing-sidebar if unused. Keep <main> as scroll container and STACK_ROOM/--main-pb intact. cycleView already wraps; if any change to it is made, store.ts joins scope with a store.test unit test. Update all sidebar-referencing tests and replace the failing 'PageDown/PageUp switch tabs...' App test."
    wave: 2
    depends_on: [T1, T2]
    agent: gem-implementer
    status: pending
    retries_used: 0
    context_cluster: shell_nav
    acceptance_criteria:
      - "No Sidebar/aside 'Sidebar' remains; header has two rows: row 1 with brand, game name (truncate class + title attr), deploy progress, account status, Quit; row 2 with a single-line role=tablist listing all 8 VIEWS with icons and labels; Activity badge preserved; hint line removed."
      - "Top tabs are rendered by the T1 Tabs component (no second tablist implementation in App.tsx)."
      - "Gamepad LB/RB and keyboard PageUp/PageDown cycle views with wrap-around (last->first, first->last via existing store.cycleView); with a dialog open they switch the dialog's tabs (BrowseDetails) and never the view; LT/RT still emit PAGE_EVENT only. Covered by App.test and nav/actions tests. If store.ts is changed, store.test covers wrap-around."
