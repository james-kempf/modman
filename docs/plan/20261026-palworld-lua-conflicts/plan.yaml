      - "The mods.txt path is derived from the resolved mods_dir (new or legacy, via T01's probe). Tests cover both."
      - "Deploy adds 'Name : 1' for every enabled staged UE4SS mod, and disable removes it. User and other entries are preserved and the Keybinds entry stays last (tests)."
      - "shared_files paths are excluded from FileConflict (loadorder/conflicts.rs) and from plain file placement (place.rs/plan.rs). Test: two mods shipping mods.txt -> no conflict and no overwrite of the merged file."
      - "The original mods.txt is backed up before the first modification. Purge policy: if the file's sha equals modman's last-written sha, restore the original byte-identically (test compares bytes incl. CRLF and trailing newline). If the user changed it since, remove only modman-added lines and keep user edits (test)."
      - "If mods.txt is missing, deploy creates it and purge removes it when modman created it (test)."
      - "Crash safety: a test simulates a crash after mods.txt is written but before the journal commit. Recovery or the next deploy/purge restores the original bytes (test)."
      - "Hermetic: temp HOME/XDG/modman data-dir env and temp game dirs only."
