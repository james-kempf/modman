      high_risk_signals: [shared_state, data_flow_change]

  - id: T04
    title: Data-safe restage action (core + CLI)
    description: "Reuse the install pipeline with kept archives. New: affected-mod selection, carry-over of user-modified files, an atomic dir swap, and a poisoned-backup precheck."
    wave: 2
    depends_on: [T01, T02]
    agent: gem-implementer
    status: completed
    output: "patch plc/T04.patch (base tree 82323c6+T01+T02); app::restage::{restage,RestageRequest,RestageReport}; CLI `modman mods restage`; also edits modman-cli commands/mod.rs (dispatch); 563 workspace tests pass"
    retries_used: 0
    context_cluster: ue4ss_layout
    acceptance_criteria:
      - "Restage first runs T02 dry_run for the game. If confirmed poisoned backups exist, it blocks with a message pointing to clean-backups unless --ignore-poisoned is given. Test with a poisoned backup present: restage blocks and changes nothing."
      - "Restage reinstalls affected mods (or the given ids) from kept archives into a new staging dir, keeping enabled state, priority and FOMOD choices. Mods with no archive are reported, not failed."
      - "User-modified staged files (staged sha != archive sha) carry over to the matching relative path within the mod folder in the new layout. Files with no match go to a backup dir and are reported. Tests cover both."
      - "The old staged dir is kept until the new one is fully built, then swapped atomically (rename). A test injecting a failure mid-restage shows the old staged dir intact."
      - "Test: a mod staged with the old root layout is restaged under ue4ss/Mods/<Folder>/, and the following deploy removes the old root-level files from the temp game dir."
      - "CLI: `modman mods restage [--all|<id>...] [--ignore-poisoned]` with a CLI test."
      - "Hermetic: temp HOME/XDG/modman data-dir env and temp game dirs only."
      - "cargo test --workspace, clippy -D warnings and fmt --check pass."
    handoff:
      constraints:
        - "Owns the new crates/modman-core/src/app/restage.rs and its registration in crates/modman-core/src/app.rs, crates/modman-cli/src/commands/mods.rs and crates/modman-cli/src/cli.rs (rebase on T02's cli.rs hunk). Do not edit app/mods.rs or app/games.rs (user-dirty paths)."
      high_risk_signals: [migration, irreversible]

