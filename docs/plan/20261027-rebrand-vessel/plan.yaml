  - id: T03
    title: Resumable, locked first-launch migration of dirs, DB, staging and symlink deployments
    description: |
      Rung: new code (nothing in std or the platform does app-specific state migration). Add the vessel-core
      module `migrate` with `pub fn run(paths: &Paths, env: &EnvSnapshot) -> Result<MigrationReport, MigrateError>`
      and an ordered step list that T04 extends. Use only legacy.rs names. Order (R1), each step recorded in
      the marker (R3):
       1) Detect legacy sources: default XDG dirs only (R5 withdrawn, see decisions R5 WITHDRAWN);
          warn for every MODMAN_* var set. No sources and no marker -> no-op, create nothing.
       2) Locks: take vessel-migration.lock and the OLD deploy.lock (flock, non-blocking) for the whole run;
          probe the D-Bus name legacy::LEGACY_DBUS_NAME (R6). If busy or owned, abort with "Close modman before
          starting Vessel" and create no vessel dirs.
       3) Stop and disable the old timer (`systemctl --user disable --now modman-autoupdate.timer` via the
          existing systemctl seam, VESSEL_SYSTEMCTL). Leave the unit files for T04.
       4) Open the old DB and run PRAGMA wal_checkpoint(TRUNCATE), then close it.
       5) Config dir, DB file and log: copy to the new dirs (copy-not-move), verify by sha256, rename the DB to
          vessel.db and the log to vessel.log.
       6) Bulk data (downloads, per-game dirs): atomic rename old->new per entry. On EXDEV, copy to
          '<new>.migrating', verify, rename, then remove old (R2). A leftover *.migrating with its step not done
          is deleted and redone.
       7) Per-library staging (R4): for each library from games.folder/Steam libraries, rename
          '<lib>/.modman/staging' to '<lib>/.vessel/staging'. An unreachable library is marked 'offline'; an
          existing target with no marker entry is marked 'conflict'. Both are retried on later runs.
       8) DB rewrite in ONE transaction on vessel.db: replace the exact prefixes '<old data>/' -> '<new data>/'
          and, only for libraries marked done, '<lib>/.modman/staging/' -> '<lib>/.vessel/staging/', in every
          column listed in shared_context.migration, incl. deploy_journal_steps.detail JSON (parse and rewrite
          the path fields, do not string-replace JSON). The 'data-dir' setting changes only if it equals the old
          default.
       9) Symlink retarget (R7): for deployments rows with method='symlink' whose source was rewritten, if the
          game-side read_link equals the OLD source, replace it atomically (temp symlink + rename) with the NEW
          source; otherwise skip and report.
      10) After all steps (incl. T04's) are done: remove the old XDG dirs, set the marker to finished, release
          the locks.
      Conflict rule (R3): an existing vessel path counts as a conflict only when there is no marker. Then
      nothing is moved, the old data stays intact and the report says so. With a marker, resume from the
      first unfinished step. Wire it into the CLI main.rs and desktop lib.rs before logging/Store::open, and
      emit the buffered report after logging init (R12). An abort is a user-visible error: CLI non-zero exit,
      GUI blocking dialog/stderr before the window.
    wave: 2
    depends_on: [T01]
    agent: gem-implementer
    status: completed
    retries_used: 0
    context_cluster: migration
    acceptance_criteria:
      - "Test (happy path): a legacy layout (config, modman.db in WAL mode, modman.log, downloads, per-game dir, per-library .modman/staging, symlink + hardlink + copy deployments, journal detail JSON) migrates. Every listed DB path column and the detail JSON point at the new paths, symlinks resolve to the new staging, verify() reports all intact, and files are byte-identical."
      - "Test: a second run is a no-op (nothing moved, DB unchanged, marker finished)."
      - "Test: a vessel dir already present with no marker -> old data untouched, nothing overwritten, conflict reported."
      - "Test: fresh install (no legacy sources) -> no dirs and no marker created."
      - "Test (R8): a crash injected after each step (fault-injection hook) followed by a rerun converges to the happy-path end state."
      - "Test (R8): a partial EXDEV copy (simulated via a test seam) leaves a *.migrating dir; the next run deletes it, redoes the copy and keeps the old dir intact until verify passes."
      - "Test (R8): the old deploy.lock held by another fd -> abort error, no vessel dirs and no marker created."
      - "Test (R8): rows written to the old DB and present only in -wal before migration survive in vessel.db."
      - "Test (R8): an offline library (path missing on run 1) is marked offline, its staging prefix is not rewritten, and run 2 with the library present migrates it and rewrites its rows."
      - "Test (R8, R5 withdrawn): MODMAN_DATA_DIR pointing at a bash-tool dir is NOT a source; that dir is untouched and a bash-tool-only warning appears."
      - "Test: a custom data-dir setting outside the old default is preserved."
      - "Test: a forced failure inside the DB rewrite leaves vessel.db unchanged (single transaction)."
      - "Test: a symlink whose target the user changed is not retargeted and is reported."
      - "D-Bus probe: unit-tested via an injectable probe trait (owned -> abort message)."
      - "The report is emitted only after logging init (asserted in a test or by code-structure review); cargo test passes; cargo check -p vessel-desktop passes or the skip is documented."
    handoff:
      constraints:
        - "Never delete old data before a verified copy/rename; never overwrite an existing vessel path without a marker."
        - "Only existing workspace deps (std, rusqlite, walkdir, rustix, sha2, serde_json, zbus); no new crates."
        - "All old names come from legacy.rs. Do not commit."
      relevant_context:
        - "store.rs:204-228 flock deploy lock; deploy.rs:9-11,113-135,228; deploy/engine.rs:942-1000 verify(); migrations/0001-0005.sql; config.rs ConfigKey::DataDir; app/actions.rs SYSTEMCTL_ENV; autoupdate.rs UNIT."
      high_risk_signals: [migration, breaking_change, data_flow_change]
      critic_signals: [breaking_change]

