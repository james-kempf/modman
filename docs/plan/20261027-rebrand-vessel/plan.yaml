    - "Binaries: modman -> vessel, modman-desktop -> vessel-desktop. npm package name -> vessel-desktop."
    - "Identifier: org.vessel.app; D-Bus SINGLE_INSTANCE_BUS org.vessel.app.SingleInstance, path /org/vessel/app/SingleInstance."
    - "XDG: ~/.config/vessel, ~/.local/share/vessel, ~/.local/state/vessel; files vessel.db, vessel.log; ProjectDirs::from(\"\", \"\", \"vessel\")."
