  migration:
    - "Entry points: crates/vessel-cli/src/main.rs (~:86) and apps/desktop/src-tauri/src/lib.rs (~:38) call Paths::from_env(); migrate::run goes right after, before logging init and Store::open; report emitted after logging init (R12)."
    - "Old locations: ~/.config/modman (or $MODMAN_CONFIG_DIR), ~/.local/share/modman (or $MODMAN_DATA_DIR) with modman.db(+-wal/-shm), deploy.lock, downloads, per-game <domain>/ dirs; ~/.local/state/modman/modman.log; <lib>/.modman/staging/<domain>."
    - "Absolute-path columns: mods.archive, mods.staging_dir (0001); backups.store_path, deployments.source (0002); downloads dest_path, part_path (0003); collections.dir (0004); deploy_journal_steps.detail JSON 'source' and other path fields (0002:71); settings 'data-dir' (config.rs ConfigKey::DataDir)."
    - "Deploy methods: hardlink|reflink|symlink|copy recorded in deployments.method; verify() compares symlink target to deployments.source exactly (deploy/engine.rs:972-977)."
    - "Marker: <new config dir>/migration.json {version, steps:{name: done|pending|conflict}, libraries:{path: done|offline|conflict}, started_at, finished_at}, written atomically (temp + rename) after each step."
    - "Locks: old <old data>/deploy.lock (flock, store.rs:204-228) + new <new data parent>/vessel-migration.lock, held for the whole run."

