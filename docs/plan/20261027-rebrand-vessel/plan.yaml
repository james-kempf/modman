    - "legacy.rs (T01) constants: LEGACY_APP_DIR='modman' (XDG leaf), LEGACY_DB_FILE='modman.db', LEGACY_LOG_FILE='modman.log', LEGACY_KEYRING_SERVICE='modman', LEGACY_UNIT='modman-autoupdate', LEGACY_NXM_DESKTOP_FILE='modman-nxm.desktop', LEGACY_STEAM_APP_NAME='modman', LEGACY_STAGING_DIR='.modman/staging', LEGACY_DBUS_NAME='org.modman.app.SingleInstance', LEGACY_ENV_PREFIX='MODMAN_', LEGACY_APP_ID='org.modman.app'. paths::LEGACY_CONFIG_DIR (bash v3) stays where it is."
