plan_id: 20261027-rebrand-vessel
status: completed
tldr: |
  Rename modman to Vessel across crates, binaries, Tauri/bundle ids, IPC names, env vars, packaging,
  UI and docs. All old names live in one legacy-constants module. On first launch, a resumable migration
  runs while holding a lock and keeps a state marker. It aborts if a modman process is alive (deploy.lock
  or D-Bus name). It stops the old timer, checkpoints the WAL, copies small state, renames bulk data
  (EXDEV-safe via *.migrating), moves each library's staging dir, rewrites stored absolute paths (incl.
  journal JSON) and retargets symlink deployments. It then carries over the keyring, systemd, nxm handler
  and Steam shortcut (keeping the legacy appid). No commits.
created_at: "2026-10-27"
created_by: gem-planner
revision: 2
replan_count: 1
planner_revision_used: true

baseline:
  objective: 'Rebrand the application from "modman" to "Vessel" (repo: /home/jkempf/Repositories/modman, branch rust-rewrite).'
  acceptance_criteria:
    - 'All user-facing text (window titles, UI strings, about/settings, README, docs) says Vessel; no remaining user-facing "modman"/"Modman".'
    - 'Crate/package/binary names, app identifier (e.g. Tauri/bundle identifier if present), and config/data/cache directory paths renamed to Vessel equivalents (lowercase "vessel" where identifiers require).'
    - 'On first launch, existing user data/config under old modman paths is migrated to the new vessel paths (move/copy once, idempotent, no data loss if new path already exists).'
    - 'Project builds; existing tests pass; migration has a test.'
  captured_at: "2026-10-27"

replan:
  reason: "Critic review blocked revision 1 on migration data-loss risks (findings R1-R14)."
  changed_tasks: [T01, T02, T03, T04, T05, T06]
  added_tasks: []
  removed_tasks: []
  revised_tasks: [T01, T02, T03, T04, T05, T06]
  invalidated_tasks: []
  invalidated_assumptions:
    - "rev1: 'Env vars renamed with no fallback' (R5: MODMAN_DATA_DIR/MODMAN_CONFIG_DIR are now legacy migration sources)."
    - "rev1: 'new path exists => conflict' (R3: conflict only when there is no migration marker)."
    - "rev1: 'prefix rewrite of DB is sufficient' (R7: symlink deployments and deploy_journal_steps.detail JSON also embed absolute paths)."
  preserved_acceptance_criteria:
    - "All 4 baseline acceptance criteria unchanged."
  new_risks:
    - "Symlink deployments in game dirs point at absolute staging paths; moving staging without retargeting breaks deployed mods (R7)."
    - "A Flatpak app-id rename changes the sandbox data root ~/.var/app/<id>."
  progress_signal: "No tasks executed yet; plan revised before dispatch."

decisions:
  - "Naming table (shared_context.naming) is fixed at plan time so code, packaging and docs tasks need no coordination."
  - "Identifier org.modman.app -> org.vessel.app (mirrors existing pattern); D-Bus single-instance name follows."
  - "R10: T01 creates vessel-core/src/legacy.rs, the single home of every old name. T03/T04 import from it. The residual-grep allowlist points only at that file, the migration module/tests, and the README migration section."
  - "Rename (W1) is separate from migration (W2/W3) so the high-risk data work does not share a retry blast radius with a 160-file rename."
  - "Migration split: T03 = process safety + filesystem + SQLite + symlinks (data-loss surface). T04 = keyring/systemd-install/nxm/Steam shortcut. They run sequentially because both edit the migrate step list."
  - "R1: stopping/disabling the old modman-autoupdate timer moves into T03 and runs before any FS move. T04 only removes the old unit files and installs the vessel units."
  - "R1 step order (fixed): acquire locks -> D-Bus probe -> stop old timer -> wal_checkpoint(TRUNCATE) -> XDG dirs -> db/log rename -> per-library staging -> DB path rewrite -> symlink retarget -> integrations (T04) -> marker done."
  - "Copy vs move: config dir, DB (+wal/shm after checkpoint) and log are COPIED (small). Bulk data (downloads, per-game data, staging) is moved by atomic rename. Old dirs stay until the marker records every step done, then the old XDG dirs are removed."
  - "R2 EXDEV fallback for bulk: copy to sibling '<new>.migrating', verify (file count + size + sha256 of each file), atomic rename to <new>, then remove old. At startup a leftover *.migrating whose marker step is unfinished is deleted and the copy restarts. Old is never removed before verify."
  - "R7 resolution, from code: deploy uses the chain hardlink -> reflink -> symlink -> copy (crates/modman-core/src/deploy.rs:9-11, Method enum :113). The method is recorded per file in deployments.method (migrations/0002_deploy.sql:29), with deployments.source as the absolute staged path. verify() requires read_link(game file) == deployments.source exactly (deploy/engine.rs:972-977). deploy_journal_steps.detail JSON also embeds 'source' (0002_deploy.sql:71). So symlink deployments break when staging moves. T03 retargets them: for each deployments row with method='symlink' whose game-side link currently reads the OLD source, atomically replace the link (temp symlink + rename) with the NEW source. Links whose target was changed by the user are skipped and reported. Hardlinks keep the game-side inode and pass verify (it checks the game file's inode). Reflinks and copies are independent of staging. On EXDEV the hardlink sharing is lost but the content stays valid; this is reported, not an error."
  - "R5: MODMAN_DATA_DIR / MODMAN_CONFIG_DIR, when set, are the legacy SOURCE paths for migration. Any MODMAN_* variable set at startup gives a loud deprecation warning naming its VESSEL_* replacement. They are not honoured as runtime config after migration."
  - "R6: if the session bus name org.modman.app.SingleInstance has an owner, or the old deploy.lock is held, the migration aborts before touching anything with 'Close modman before starting Vessel'. The process exits non-zero (CLI) or shows a blocking error (GUI), and no vessel dirs are created (no fresh state while legacy data is unmigrated)."
  - "R12: MigrationReport is buffered in memory and emitted after logging init, because logging writes into the migrated state dir."
  - "R14 (orchestrator clarification): the existing Steam shortcut keeps its legacy appid. Name and exe are updated in place so playtime and controller config survive. Only new installs use the vessel-derived appid. Art is untouched because the appid is unchanged."
  - "Flatpak packaging exists (packaging/flatpak/org.modman.app.yml), so it is in scope: rename via X-Flatpak-RenamedFrom=org.modman.app.desktop plus metainfo <replaces>/<provides>. In-sandbox XDG dirs migrate via the same T03 code once Flatpak has carried ~/.var/app over (verified by T02)."
  - "R11: docs (T05) run after T04 so the README describes the implemented behaviour; T06 also checks that the README matches the code."
  - "Out of scope for rewording: legacy/ (reference-only bash tool + web UI) and docs/plan/** (historical records)."

  - "R5 WITHDRAWN (T06 review, 2026-10-27): the HEAD Rust modman never read MODMAN_DATA_DIR/MODMAN_CONFIG_DIR; only the legacy bash tool did. Legacy sources are the XDG siblings only; those vars are reported as bash-tool-only and ignored."

assumptions:
  - "Linux XDG only (directories::ProjectDirs); no macOS/Windows paths."
  - "Webview has no persisted storage (no localStorage/IndexedDB in apps/desktop/src), so the Tauri identifier change loses no webview data."
  - "The deploy lock is a flock on <data>/deploy.lock (store.rs:204-228), so holding the OLD lock path blocks a concurrently running old modman deploy/purge."
  - "zbus is an existing workspace dependency (used by vessel-cli); the D-Bus probe may use it from cli/desktop entry points or core without adding a new crate."
  - "A user-customised 'data-dir' outside the old default stays in place; per-game data under it is not moved, and only paths under the old defaults/staging prefixes are rewritten."
  - "git mv for renames is acceptable (stages, no commit)."

