    description: "Integrate T07 into the Load order. Each row gets a select control (its own spatial stop, left of the Toggle) and the move menu (top/bottom/#N via modMove). A polite live region announces moves ('<name> moved to position N of M') and selection counts, extending the existing role=status. BulkBar actions: Enable/Disable via modsSetEnabled(ids), and Uninstall via modsUninstall(refs, false) with T02's danger confirm ('Uninstall N mods?', 'Delete archive too' off by default). Bulk Undo uses T11's helper: one modRestore(tokens) call over the entries with restorable=true (availability only from restorable; positions applied lowest first in the backend). Clear empties the selection. Focus after a bulk action or move stays on a sensible element (the moved row's control or the bar)."
    wave: 5
    depends_on: [T07, T11]
    agent: gem-implementer
    context_cluster: mods_view
    status: pending
    retries_used: 0
    acceptance_criteria:
