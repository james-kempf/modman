plan_id: 20261111-ux-audit-mods
status: pending
tldr: |
  Fix all 29 Mods-view UX audit findings across 6 waves with at most 2 implementer streams at once.
  Rev 3 (scope change): uninstall Undo is a full, lossless restore backed by new Rust support. T10 (stream B, wave 3)
  adds a backend session store of restore snapshots keyed by opaque tokens (UninstallResult.restore[]) and mod_restore(tokens). Stream A owns apps/desktop/src/views/Mods.tsx
  in order: T04 states/errors/focus, T05 hierarchy/nav/style, T06 profile undo/optimistic toggle/state lift/mock gaps,
  T11 single-uninstall Undo via modRestore, T08 reorder/bulk integration (bulk Undo). Stream B owns the shared files:
  T02 danger confirm + PromptDialog, T03 notify action/Toggle/DESIGN.md, T10 backend restore, T07 standalone
  move/bulk components. T09 (browser tester) verifies in wave 6. Waves 1-2 are unchanged.
created_at: 2026-11-11
created_by: gem-planner
revision: 4
replan_count: 1
planner_revision_used: true

baseline:
  objective: "Fix all 29 UX audit findings for the Mods view in /home/jkempf/Repositories/modman (branch rust-rewrite), desktop app apps/desktop/src plus the Rust backend crates/ where a finding needs it. User said: 'fix all'."
  acceptance_criteria:
    - "Each finding #1-#29 below is fixed, or listed as deliberately not fixed with a concrete reason."
    - "Follow /home/jkempf/Repositories/modman/DESIGN.md. Any new token goes into DESIGN.md and index.css @theme first. Update DESIGN.md for any new pattern: undo toast, bulk bar, move-to-position, ErrorNote usage, danger confirm."
    - "Gamepad and keyboard focus is never lost. No native disabled on focusable actions; use `inactive` or `busy`."
    - "npm run typecheck passes and npx vitest run has 0 failures (currently 537/537) in apps/desktop. cargo test and cargo clippy pass for any touched Rust crate. Add tests for each behaviour change."
    - "Do not commit."
  captured_at: 2026-11-11

replan:
  reason: "User scope change after T01's verdict: uninstall Undo must be a full, lossless restore (FOMOD choices, collection membership, Nexus metadata, same uid, enabled state, position), backed by new Rust support. The multi-step frontend undo through existing IPC is lossy: fomod_choices and collection_mods cascade-delete, metadata is dropped, and the uid can change."
  changed_tasks: [T06, T07, T08, T09, T10, T11]
  added_tasks: [T10, T11]
  removed_tasks: []
  preserved_acceptance_criteria: ["All baseline acceptance criteria unchanged; wave 1 (T01 done, T04 done, T02 in progress) and wave 2 (T03, T05) unchanged."]
  new_risks:
    - "schema/data_flow: restore re-inserts mods rows with a fixed uid and the original id-linked rows (fomod_choices, collection_mods); a partial failure could leave orphan files or rows."
    - "contract change: UninstallResult gains restore[] {token, uid, name, restorable, reason?} and a new mod_restore(tokens) command; snapshots stay in a backend session store (rev 3.1)."
    - "Restore runs the installer non-interactively; a permissive Ui could overwrite another mod. Mitigation: a rejecting Ui plus uid, name and folder conflict checks."
  progress_signal: "T01 completed (verdict a/b/c); T04 completed; T02 in progress. Rev 3.1 (revision 4): review warning folded in (token design, rejecting Ui, atomicity, losslessness, conflict and expiry); waves, ownership and dependencies unchanged."
  revised_tasks: [T06, T08, T09]
  invalidated_tasks: []
  invalidated_assumptions: ["Rev 2 decisions '#1/#2 undo' (existing-IPC reinstall) and 'Undo failure policy' (frontend multi-step undo) are superseded by T10/T11."]

decisions:
  - "Mods.tsx (864 lines) is edited by one stream only (A), one task per wave (T04 > T05 > T06 > T08), so it never has two writers at once. Splitting the file was rejected: not requested, and it would add refactor risk."
  - "#14 Segmented to Tabs: the Mods sub-tabs use Tabs with focusable (roving tabindex, arrows/D-pad, A/Enter) and are NOT bound to LB/RB. Tabs only listens for TAB_EVENT inside [data-nav-scope] (Dialog/Select), and the view is not a nav scope, so LB/RB keep cycling the app view bar. No nav changes needed; a test locks this in."
  - "#1 backend: add an optional richer confirm (title, yes/no labels, danger flag, optional checkbox option) as a new Ui trait method with a default impl that calls confirm(question, default_yes) and returns the option at its default (unchecked), so the CLI and Headless keep working. Core default_yes for uninstall stays true: CliUi::confirm returns default_yes with no tty and on Enter (crates/vessel-cli/src/ui.rs:229-241), and Headless returns it (crates/vessel-core/src/app.rs:233-235). Which GUI button gets focus is a GUI-only concern: danger=true means PromptDialog autofocuses the no ('Keep mod') button. Only gui_ui.rs and PromptDialog read it."
  - "Rev 3 wave layout: T10 (backend restore) takes stream B in wave 3, so T07 moves to wave 4 (still stream B), T08 to wave 5 and T09 to wave 6. Rev 2's T06 is split: T06 (wave 3, stream A) keeps #2/#21/#23 plus the uninstall confirm wiring and mock gaps; the new T11 (wave 4, stream A) adds the single-uninstall Undo once T10 has landed."
  - "User decision (authoritative): deleting the uninstall archive is opt-in. The danger confirm has a 'Delete archive too' checkbox option, off by default, for single and bulk uninstall. The backend deletes archives when delete_archive || option_checked. A kept archive means Undo is offered. A ticked option means the archive is deleted and there is no Undo for that uninstall. The frontend always calls modsUninstall(refs, false) and decides on Undo from UninstallResult.archives (deleted list): empty = Undo, non-empty = no Undo."
  - "Prompt serde contract: new Prompt::Confirm fields title/yes_label/no_label/option use #[serde(skip_serializing_if = \"Option::is_none\")]; danger uses #[serde(default)]; the confirm Answer gains option_checked with #[serde(default)] (false). TS types mark these optional and also accept null (string | null), so missing and null both behave as legacy."
  - "#1 undo (rev 3.1, user choice 'Full restore (backend)'; orchestrator adopted the reviewer's token design): snapshots stay in the backend. A GUI uninstall opts in through an app-layer parameter (capture_restore); it then stores one RestoreSnapshot per mod in an in-memory, per-game store keyed by an opaque random token (not derived from a path or uid), which lives for the session (TTL optional). UninstallResult gains only restore: [{token, uid, name, restorable, reason?}] with reason folder_install | archive_deleted | outside_downloads. mod_restore(tokens) takes tokens only. Undo availability comes ONLY from restorable; the frontend never re-derives it from archives or snapshots. The CLI never opts in, so its output is byte-identical."
  - "#2 undo (T01 b, lossless with existing IPC): auto-save a 'before-<name>' profile and offer Undo in the toast. Prefixing an already-valid name keeps it valid under profiles.rs:11-16. save_profile asks 'Overwrite profile?' on an existing name (app/mods.rs:171-185), so a flow-owned snapshot is replaced by profileDelete then profileSave. Undo is profileLoad(snapshot)."
  - "CLI `vessel restore` is out of scope (default no): vessel-cli stays unchanged apart from compiling against the new UninstallResult field."
  - "Restore safety (rev 3.1): no snapshot leaves the backend, so there is no untrusted-snapshot input. At restore time the backend still checks that the archive exists (archive_missing), that the uid, name and install folder are free (conflict), and that the token is known and not expired (expired). Positions are clamped to 1..len+1. Restore uses a rejecting Ui: every confirm or choose cancels or errors, mapped to conflict or install_failed. It never uses Headless or default_yes."
  - "Mock ownership for mod_restore (rev 3.1): T11 owns the mock stub (mods_uninstall returns restore[], mod_restore handler, and an entry in demo.test.ts's command list). demo.test.ts:107 checks a hand-kept command list, not ipc/commands.ts, so T10's gates pass without a mock handler. T06 and T10 share a worktree in wave 3, so each re-runs typecheck and vitest once the other's edits have settled, before reporting."
  - "Restore atomicity (rev 3.1): give the install pipeline a caller-owned transaction where feasible. Otherwise use a compensating rollback: remove the row through the same path remove_mods uses, delete the staged and extracted files, and leave no child rows. Bulk restore applies tokens by snapshot position, lowest first, and continues past a failed mod with per-mod results. Losslessness: the snapshot copies the whole mods row generically (every column) and every column of each child row. Every table with an FK to mods across ALL migrations is either snapshotted or recorded as not needed, and child rows are remapped if mods.id changes."
  - "#2 snapshot naming: the flow tracks the snapshot names it created (per game, in the store's Mods UI slice). If 'before-<name>' exists and this flow made it, it is replaced (re-saved), so at most one snapshot per source profile accumulates. If it exists and the flow did not make it (a user profile), the flow picks the first free 'before-<name>.<n>' (n=2,3,...). A user profile is never overwritten. Undo calls profileLoad(snapshot) directly, never the auto-saving load handler, so Undo creates no new snapshot."
  - "Undo failure policy (rev 3.1): modRestore returns per-mod results with typed errors (archive_missing, conflict, expired, install_failed). Each failed mod gets one error notice naming the mod and the reason, successes get one success notice, and the list always refetches afterwards. A collection that no longer exists is skipped with a warning."
  - "#23 (store lift) moves to T06 and is not in T05, because T03 also edits app/store.ts in wave 2."
  - "#12/#13 are split: T07 (stream B, wave 4) builds standalone components and a hook in new files with unit tests; T08 (stream A, wave 5) wires them into Mods.tsx. This keeps two streams busy without sharing a file."
  - "#13 selection model: each load-order row gets a checkbox-style select control as its own spatial focus stop, left of the enable Toggle. A sticky bulk bar shows when 1+ rows are selected: count plus Enable/Disable/Uninstall/Clear. B/Escape is not used to clear, because B is Back. No range or shift-select (YAGNI)."
  - "SKELETON_DELAY_MS moves from views/Browse.tsx into components/ui/styles.ts (or the ui index) so Browse and Mods share one constant (#22, reuse)."
  - "Independent verification task T09 (browser tester) was added because the 'focus never lost' and gamepad criteria cannot be shown by unit tests alone."

assumptions:
  - "Notice.tsx already renders an optional action, but store.notify(tone, text, game) has no generic action. T03 adds one (label + handler) and does not create a new toast surface."
  - "Button supports inactive. IconButton currently maps only busy to inactive, so T04 (stream A, wave 1) adds an inactive pass-through and the 20px glyph size used by #25."
  - "The danger confirm reaches the GUI through apps/desktop/src-tauri/src/{prompt.rs,gui_ui.rs} and ipc/types.ts Prompt 'confirm'. The demo backend in apps/desktop/src/mock must emit the new optional fields."
  - "modMove(reference, spec, arg) accepts the specs first, last and #N (ipc/commands.ts:240)."
  - "InstallMeta.uid and InstallMeta.fomod_choices already exist (crates/vessel-core/src/mods/install.rs:43-48), so restore can reuse the install pipeline with a fixed uid and replayed choices instead of a new installer."
  - "The baseline is 537/537 vitest; the pre-existing vite process pid 220199 must not be touched."

