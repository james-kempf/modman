  - id: T10
    title: "Backend lossless restore: token store + mod_restore (#1 Undo backend)"
    description: "New code, justified: the existing IPC cannot restore fomod_choices, collection_mods, Nexus metadata or the uid (T01 a). Reuse the install pipeline (InstallMeta.uid, InstallMeta.fomod_choices, mods/install.rs:43-48). Steps: (0) List every table with an FK to mods across ALL migrations (crates/vessel-core/migrations/*), and decide for each one: snapshot it, or record why not. (1) The app-layer uninstall gets an opt-in capture_restore parameter (the GUI passes true; the CLI never does). When it is set, before deleting, capture a RestoreSnapshot per mod: the whole mods row copied generically (every column), every column of every FK child row in scope (fomod_choices, collection_mods, any others found in step 0), enabled, position and the archive path. Store it in an in-memory, per-game session store keyed by an opaque random token. UninstallResult gains restore: Vec<{token, uid, name, restorable, reason?}> with #[serde(default, skip_serializing_if = \"Vec::is_empty\")]; reason is folder_install | archive_deleted | outside_downloads, and restorable is false whenever a reason is set. (2) restore(game, tokens) looks up each token (unknown or expired gives expired), sorts by snapshot position (lowest first), and per mod checks that the archive exists (archive_missing) and that the uid, name and install folder are free (conflict). It installs from the archive with the fixed uid and replayed fomod_choices through a REJECTING Ui: any confirm or choose cancels or errors, mapped to conflict or install_failed; never Headless or default_yes. It writes the row, child rows (remapped if mods.id changes; collections that no longer exist are skipped with a warning), enabled and the position clamped to 1..len+1. Atomic per mod: a caller-owned transaction around the install pipeline where feasible, otherwise a compensating rollback (remove via the remove_mods path, delete staged and extracted files, no child rows left). A token is consumed on success. Returns per-mod results {uid, name, ok | error kind + message, warnings}. (3) A src-tauri mod_restore command taking tokens only (job or call, matching mods_uninstall), modRestore(tokens, game?) in ipc/commands.ts, and the types in ipc/types.ts (optional or nullable fields). vessel-cli unchanged; no `vessel restore`. No mock edits (T11 owns the mod_restore mock; demo.test.ts:107 uses a hand-kept list)."
    wave: 3
    depends_on: [T02]
    agent: gem-implementer
    status: pending
    retries_used: 0
    acceptance_criteria:
      - "FK inventory: the report lists every table with an FK to mods across all migrations, each marked snapshotted or not-needed with a reason. A test asserts the snapshot covers every column of the mods row (it is built from the table's column list, not a hand-kept field list)."
      - "Round-trip cargo test: install a mod with FOMOD choices, add it to a collection, set enabled and a non-edge position, uninstall with capture_restore (archive kept), restore by token. The mod store contents match (every mods column and every child row, including fomod_choices, collection_mods and the uid, position and enabled), and after a deploy the deployed file set matches."
      - "Bulk round-trip test: 3 mods at non-adjacent positions come back at their original positions (applied lowest first)."
      - "Clamping test: uninstall a single mod, reorder or remove other mods, restore it. Its position is clamped to 1..len+1 and the restore succeeds."
      - "Conflict test: after the uninstall, install a different mod with the same name or install folder, then restore. The other mod (row, files, position) is untouched, and restore returns a typed conflict error. A uid already in use also gives conflict."
      - "Rejecting Ui test: the restore path uses a Ui whose confirm or choose returns cancel or Err, mapped to conflict or install_failed. A test proves restore never reaches Headless or default_yes (for example a Ui that records calls and rejects, with the restore still typed-failing instead of proceeding)."
      - "Atomicity test: inject a failure after the install committed (a forced error in the collection_mods write or the position write). Afterwards there is no mods row, no child rows and no staged or extracted files for that mod; other mods in the same bulk call still restore."
      - "Errors: archive deleted after the uninstall gives archive_missing for that mod while the rest of a bulk restore succeeds; an unknown or already-used token gives expired."
      - "Tokens are opaque and random: a test shows they contain no path, uid or name and are unique per capture."
      - "restorable/reason: a folder install gives restorable=false with folder_install; option_checked deletion gives archive_deleted; an archive outside the downloads dir gives outside_downloads; a kept archive gives restorable=true with no reason."
      - "CLI unchanged: a test pins vessel-cli uninstall output (stdout/stderr) byte-identical to the pre-change output (golden), the CLI does not pass capture_restore, and UninstallResult without capture serializes exactly as before (no restore key). Legacy UninstallResult JSON deserializes; a TS test parses both shapes."
      - "cargo test and cargo clippy -D warnings pass for vessel-core, vessel-cli and src-tauri. After T06's mock edits settle (same worktree), npm run typecheck and npx vitest run pass (0 failures), re-run before reporting."
    handoff:
      constraints: ["Stream B. Files: crates/vessel-core (app/mods.rs, mods/*, a new restore module, tests), apps/desktop/src-tauri/src (command registration, permissions/capabilities if required), apps/desktop/src/ipc/commands.ts, apps/desktop/src/ipc/types.ts. No DB schema migration unless unavoidable (justify in the report). Do not touch views/*, app/store.ts or apps/desktop/src/mock/* (T06 owns the mock in wave 3; T11 adds the mod_restore mock).", "Shared worktree with T06: re-run all gates after both tasks' edits have settled.", "No commits."]
      relevant_context:
        - "T01 (a): fomod_choices and collection_mods are ON DELETE CASCADE (crates/vessel-core/migrations/0004_collections.sql:21-23,30-31); the uid can change on reinstall (mods/install.rs:280-298); UninstallResult at app/mods.rs:84-90 and ipc/types.ts:287-292; modReinstall needs an installed mod; ModRecord.archive is nullable."
        - "T02 has already extended the uninstall confirm and delete_archive || option_checked in app/mods.rs."
      high_risk_signals: ["schema/data_flow: re-inserting rows with a fixed uid and FK children; transactional or compensating rollback required.", "Non-interactive install on restore: must use a rejecting Ui, never default_yes.", "IPC contract change: UninstallResult.restore[] and mod_restore(tokens)."]

  - id: T11
    title: "Single-uninstall Undo via modRestore(tokens) + mod_restore mock (#1 Undo)"
    description: "Wire the uninstall success notice to Undo. The toast offers Undo only for entries of UninstallResult.restore with restorable=true, and never re-derives availability from archives or paths. Undo makes one modRestore(tokens) call. Results follow the rev 3.1 failure policy: an error notice per failed mod by kind (archive_missing, conflict, expired, install_failed), one success notice, and always a refetch. When restorable=false, the notice gives the reason in plain words (folder install, archive deleted, archive outside the downloads folder) and offers no Undo. Put the toast and restore wiring in a reusable helper that takes N restore entries, so T08 uses it for bulk. Mock (owned here): mods_uninstall returns restore[] (token, uid, name, restorable, reason) per the backend rules; mod_restore(tokens) re-adds the fixture mod with the same uid, metadata, enabled and position, supports injected failures per kind, and returns expired for unknown or used tokens. Add mod_restore to demo.test.ts's command list."
    wave: 4
    depends_on: [T06, T10]
    agent: gem-implementer
    context_cluster: mods_view
    status: pending
    retries_used: 0
    acceptance_criteria:
      - "Undo shows only when restorable is true. With restorable=false for folder_install, archive_deleted and outside_downloads, there is no Undo and the notice gives the reason (3 tests). A test fails if the view derives availability from anything other than restorable."
      - "Undo makes exactly one modRestore call with the tokens only (no paths or snapshots), and the mod comes back with the same uid, enabled state and position in the mock (test)."
      - "Archive deleted between the uninstall and Undo: the mock returns archive_missing, an error notice names the mod, and the list refetches (test)."
      - "An expired or unknown token (for example Undo pressed twice) gives a typed expired error notice and a refetch (test)."
      - "Failure injection for conflict and install_failed, and for a rejection of the whole IPC call: each gives an error notice naming the mod and reason, plus a refetch (tests)."
      - "demo.test.ts lists mod_restore, and a demo test round-trips uninstall -> mod_restore(token)."
      - "Focus after Undo lands on the restored row's control, never body (test)."
      - "npm run typecheck and npx vitest run pass (0 failures)."
    handoff:
      constraints: ["Files: views/Mods.tsx (+ tests), a small helper next to it (e.g. views/mods/restore.ts), apps/desktop/src/mock/* (+ demo.test.ts). Do not touch the views/mods/ files that T07 creates in the same wave (BulkBar, MoveToPosition, useSelection), or ipc/*.", "No commits."]

