[package]
name = "vessel-core"
description = "Core engine for Vessel: game detection, Nexus client, deployment, state"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["rar"]
# RAR via system libarchive; build without it to drop the native dependency.
rar = ["dep:compress-tools"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true
zip.workspace = true
sevenz-rust2.workspace = true
compress-tools = { workspace = true, optional = true }
reflink-copy.workspace = true
quick-xml.workspace = true
toml.workspace = true
keyring-core.workspace = true
zbus-secret-service-keyring-store.workspace = true
keyvalues-parser.workspace = true
directories.workspace = true
rustix.workspace = true
sha2.workspace = true
md-5.workspace = true
libloot.workspace = true
url.workspace = true
walkdir.workspace = true
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
