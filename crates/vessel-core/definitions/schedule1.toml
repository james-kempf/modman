# vessel-game-support: complete
# Sources: docs/game-support/schedule1.md
# Ported from the legacy bash tool game_preset (L269-300).
domain = "schedule1"
name = "Schedule I"
steam_appid = 3164500
subdir = "."
target = "game_dir"
profile = "melonloader"
support = "tested"

# The game has no native Linux build: it runs under Proton. Mods are
# MelonLoader .dll files in Mods/ (and Plugins/, UserLibs/, UserData/ for
# the mods that ship them), all in the game root.

# MelonLoader: Unity mod loader. The GitHub release asset
# MelonLoader.x64.zip (v0.7.3) holds MelonLoader/ plus the proxy version.dll
# at its top level; it serves both the IL2CPP (net6) and Mono (net35/net472)
# branches. Under Proton the proxy only loads with a native-first `version`
# DLL override.
# The Nexus page (schedule1 mod 1196, required by 341 mods) ships only
# MelonLoader.Installer.exe (file 3486): `nexus_mod_id` identifies it and the
# install is redirected to the GitHub zip, the installer is never run.
# Most popular mods declare MelonLoader off-site (https://melonwiki.xyz/...,
# one links a github.com/LavaGang/MelonLoader release asset): the aliases
# map those requirements to this loader. See docs/game-support/schedule1.md.
[[loaders]]
key = "melonloader"
name = "MelonLoader"
nexus_mod_id = 1196
required_paths = ["version.dll", "MelonLoader"]
# A mod pack that bundles MelonLoader next to mods is not the loader.
forbidden_paths = ["Mods"]
detect = ["MelonLoader", "dobby.dll"]
[loaders.launch]
dll_overrides = ["version"]
[loaders.github]
repo = "LavaGang/MelonLoader"
asset = "MelonLoader.x64.zip"
[loaders.aliases]
urls = ["https://melonwiki.xyz/", "https://github.com/LavaGang/MelonLoader"]
names = ["MelonLoader", "Melon Loader"]
