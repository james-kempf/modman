# vessel-game-support: complete
# Sources: docs/game-support/stardewvalley.md
# Ported from the legacy bash tool game_preset (L269-300).
domain = "stardewvalley"
name = "Stardew Valley"
steam_appid = 413150
subdir = "Mods"
target = "game_dir"
profile = "stardew"
support = "tested"

# Mods are folders under <game>/Mods, each with a manifest.json (the stardew
# profile keeps that structure). SMAPI is not declared as a [[loaders]] entry
# on purpose: Vessel ships it as a built-in Rust loader plugin
# (loaders/smapi.rs, key "smapi"), registered for this definition, and a
# declarative entry with the same key would be rejected as a duplicate.
