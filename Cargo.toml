[workspace]
resolver = "2"
members = [
    "crates/modman-core",
    "crates/modman-cli",
    "apps/desktop/src-tauri",
]
# The Tauri app needs system WebKitGTK to build, so plain `cargo build`
# and `cargo test` only cover the core and the CLI.
default-members = [
    "crates/modman-core",
    "crates/modman-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = ""
authors = []

[workspace.dependencies]
modman-core = { path = "crates/modman-core" }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
