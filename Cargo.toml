[workspace]
resolver = "2"
members = [
    "crates/modman-core",
    "crates/modman-cli",
    "apps/desktop/src-tauri",
]
# The Tauri app needs system WebKitGTK to build, so plain `cargo build`
# and `cargo test` only cover the core and the CLI.
default-members = [
    "crates/modman-core",
    "crates/modman-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = ""
authors = []

[workspace.dependencies]
# Exact pins from docs/plan/20261020-rust-migration/spikes.md section 7.
modman-core = { path = "crates/modman-core" }
# core
thiserror = "=2.0.21"
tracing = "=0.1.44"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream", "charset", "system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "zstd", "xz"] }
sevenz-rust2 = "=0.24.1"
compress-tools = "=0.16.1"
reflink-copy = "=0.1.30"
quick-xml = { version = "=0.42.0", features = ["encoding"] }
toml = "=1.1.8"
keyring-core = "=1.0.1"
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }
keyvalues-parser = "=0.2.4"
directories = "=6.0.0"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sha2 = "=0.11.1"
md-5 = "=0.11.0"
libloot = "=0.29.7"
url = "=2.5.8"
walkdir = "=2.5.0"
# cli
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing-appender = "=0.2.5"
zbus = { version = "=5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
# dev
tempfile = "=3.27.0"
wiremock = "=0.6.5"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
