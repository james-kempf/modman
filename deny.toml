# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-deny policy for modman (GPL-3.0-or-later).
# Licence and ban decisions: docs/plan/20261020-rust-migration/spikes.md §6-7.
# Run: cargo deny --all-features check licenses bans sources

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
# Every licence here is compatible with distributing the combined work
# under GPL-3.0-or-later.
allow = [
    # libloadorder/esplugin declare the deprecated id "GPL-3.0".
    "GPL-3.0",
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "bzip2-1.0.6",
    "MPL-2.0",
]
# The workspace's own crates are GPL-3.0-or-later and unpublished.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    # Vendors RARLAB UnRAR source: use restriction, not GPL-compatible.
    { crate = "unrar_sys", reason = "UnRAR licence is GPL-incompatible; RAR goes through libarchive (compress-tools)" },
    { crate = "unrar", reason = "wraps unrar_sys" },
    # OpenSSL-licensed C code, GPL-incompatible; rustls uses ring instead.
    { crate = "aws-lc-sys", reason = "OpenSSL licence; use rustls with the ring provider" },
    { crate = "aws-lc-rs", reason = "pulls aws-lc-sys" },
    { crate = "openssl-sys", reason = "TLS is rustls+ring only" },
    { crate = "openssl", reason = "TLS is rustls+ring only" },
    { crate = "native-tls", reason = "TLS is rustls+ring only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
yanked = "warn"
