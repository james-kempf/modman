# SPDX-License-Identifier: GPL-3.0-or-later
#
# Flatpak manifest for modman (desktop app + `modman` CLI).
#
# Build (offline, flathub style). Generate the vendored sources first, from
# the repository root, with flatpak-builder-tools
# (https://github.com/flatpak/flatpak-builder-tools):
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
#   flatpak-node-generator npm apps/desktop/package-lock.json -o packaging/flatpak/node-sources.json
# then:
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/org.modman.app.yml
#
# Runtime deps (spikes.md §2, §5): org.gnome.Platform 50 ships
# libwebkit2gtk-4.1, libjavascriptcoregtk-4.1, libsoup-3.0, librsvg and
# libarchive.so.13 (checked in the installed 49/50/51 runtimes), so nothing
# is built as an extra module. libloot is pure Rust and SQLite is compiled in
# (rusqlite `bundled`). No 7z/unrar binaries are used at runtime.
app-id: org.modman.app
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: modman-desktop

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Nexus API key in the Secret Service (keyring-core), desktop notifications.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  # The GUI owns org.modman.app.SingleInstance (allowed for the app id
  # prefix by default); `modman nxm` inside the sandbox forwards to it.
  # Steam libraries. Staging lives inside each library
  # (<library>/.modman/staging), so these grants also cover staging and the
  # Proton prefixes (<library>/steamapps/compatdata).
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.steam
  # Steam installed as a Flatpak.
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam
  # SD cards and extra drives (Steam Deck mounts SD cards under /run/media).
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  # Archives the user picks from Downloads.
  - --filesystem=xdg-download:ro
  # WebKitGTK DMA-BUF renderer crashes on some Wayland/GPU setups.
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
  env:
    CARGO_HOME: /run/build/modman/cargo
    CARGO_NET_OFFLINE: "true"
    npm_config_offline: "true"
    npm_config_cache: /run/build/modman/flatpak-node/npm-cache

modules:
  - name: modman
    buildsystem: simple
    build-commands:
      - cd apps/desktop && npm ci --offline && npm run build
      # tauri/custom-protocol makes the binary serve the embedded dist
      # instead of the dev server URL (what `tauri build` enables).
      - cargo --offline build --release --locked -p modman-cli
      - cargo --offline build --release --locked -p modman-desktop --features tauri/custom-protocol
      - install -Dm755 target/release/modman-desktop /app/bin/modman-desktop
      - install -Dm755 target/release/modman /app/bin/modman
      - install -Dm644 packaging/common/org.modman.app.desktop /app/share/applications/org.modman.app.desktop
      # Flatpak exports only files prefixed with the app id; it rewrites
      # Exec=modman nxm %u to `flatpak run --command=modman org.modman.app nxm %u`.
      - install -Dm644 packaging/common/modman-nxm.desktop /app/share/applications/org.modman.app.nxm.desktop
      - install -Dm644 packaging/common/org.modman.app.metainfo.xml /app/share/metainfo/org.modman.app.metainfo.xml
      - install -Dm644 apps/desktop/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/org.modman.app.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/org.modman.app.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/org.modman.app.png
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - apps/desktop/node_modules
          - apps/desktop/dist
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
      - node-sources.json
