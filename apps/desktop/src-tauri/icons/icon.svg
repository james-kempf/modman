<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Vessel mark copied verbatim from apps/desktop/src/assets/vessel-logo.svg; oklch fills written as the DESIGN.md sRGB values (ink-3 #1B1B1E, accent-400 #62D0A4) so every renderer agrees. Regenerate PNGs with scripts/render-brand-art.sh. -->
  <defs>
    <symbol id="badge" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="16" fill="#1B1B1E"/>
      <path d="M 11 9 c-3 6 4 7 1 10 c-2 2 1 3 4 4 M 21 9 c 3 6-4 7-1 10 c 2 2-1 3-4 4" fill="none" stroke="#62D0A4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <use xlink:href="#badge" href="#badge" width="1024" height="1024"/>
</svg>
